.xp{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr 280px;gap:12px}

.nb-ch{background:var(--bg);border-radius:10px;padding:8px 12px;border-right:4px solid var(--warn)}.nb-ch.won{border-right-color:var(--good);background:#e8f5e9;color:#1b5e20}.nb-ch-st{font-size:.85rem;color:var(--muted);margin-right:6px}.nb-ch.won .nb-ch-st{color:#1b5e20;font-weight:800}

EXTF.xpPre=function(id){const p=EXT.predict[id],c=EXT.challenge[id],nb=(EXTF.ctx.state.notebook||{})[id]||{};if(!p)return'';return `<div class="nb"><div class="nb-head"><b>📓 دفتر آزمایش — پیش از شروع</b></div><p class="nb-q">${p.q}</p><div class="nb-opts">${p.o.map((o,i)=>`<button type="button" class="nb-opt ${nb.pred===i?(i===p.a?'ok':'bad'):''}" data-nb-pred="${i}" ${nb.pred!=null?'disabled':''}>${o}</button>`).join('')}</div>${nb.pred!=null?`<p class="nb-fb">${nb.pred===p.a?'حدس تو با علم هم‌خوان است؛ حالا با آزمایش ثابتش کن.':'حدس ثبت شد. آزمایش را انجام بده و ببین چه می‌شود — اشتباه حدس زدن بخشی از دانشمند بودن است!'}</p>`:''}${c?`<div class="nb-ch ${(EXTF.ctx.state.challenges||{})[id]?'won':''}" data-nb-ch><b>🏆 چالش:</b> ${c.t} <span class="nb-ch-st">${(EXTF.ctx.state.challenges||{})[id]?'✓ انجام شد':'در انتظار…'}</span></div>`:''}</div>`};
EXTF.xpPost=function(id){const nb=(EXTF.ctx.state.notebook||{})[id]||{};if(!EXT.predict[id])return'';return `<div class="nb nb-post" data-nb-post ${nb.obs!=null||nb.done?'':'hidden'}><div class="nb-head"><b>📓 دفتر آزمایش — پس از آزمایش</b></div><label>مشاهده‌ی من (چه دیدم؟)<textarea data-nb="obs" rows="2" placeholder="مثلاً: با ۵ قاشق نمک تخم‌مرغ روی آب ماند…">${escE(nb.obs||'')}</textarea></label><label>نتیجه‌گیری من (چرا؟)<textarea data-nb="concl" rows="2" placeholder="مثلاً: چون آب نمک چگال‌تر از تخم‌مرغ است.">${escE(nb.concl||'')}</textarea></label><div class="xp-row"><button type="button" class="fx-btn" data-nb-save>ذخیره در دفتر</button><button type="button" class="fx-btn ghost" data-route="report/${id}">گزارش قابل چاپ</button></div></div>`};
EXTF.xpTick=function(el){const {state,save,cheer,toast}=EXTF.ctx,id=el._xp.id,st=el._xp.st;const c=EXT.challenge[id];if(c&&!(state.challenges||{})[id]){let ok=false;try{ok=c.check(st)}catch(e){}if(ok){state.challenges=state.challenges||{};state.challenges[id]=Date.now();save();cheer();toast('🏆 چالش انجام شد!');const box=el.querySelector('[data-nb-ch]');if(box){box.classList.add('won');box.querySelector('.nb-ch-st').textContent='✓ انجام شد'}}}
 if(st.done&&!el._xp.nbShown){el._xp.nbShown=true;const post=el.querySelector('[data-nb-post]');if(post)post.hidden=false;state.notebook=state.notebook||{};const nb=state.notebook[id]=state.notebook[id]||{};nb.done=Date.now();const x=window.__XP[id];nb.table=x.table?x.table(st):'';nb.concl_auto=x.conclude(st);save()}
 const tw=el.querySelector('[data-xp-table]');if(tw&&tw.innerHTML&&!tw.querySelector('.xp-chart')){const ch=EXTF.chartFromTable(tw.querySelector('table'));if(ch)tw.insertAdjacentHTML('beforeend',ch)}};
EXTF.chartFromTable=function(tb){if(!tb)return'';const rows=[...tb.querySelectorAll('tbody tr')].map(tr=>[...tr.children].map(td=>td.textContent));if(rows.length<2)return'';const head=[...tb.querySelectorAll('th')].map(t=>t.textContent);let col=-1;for(let c=head.length-1;c>=0;c--){if(rows.every(r=>!isNaN(numE(r[c]))&&r[c].match(/[۰-۹0-9]/))){col=c;break}}if(col<0)return'';const vals=rows.map(r=>numE(r[col])),max=Math.max(...vals,1);const W=320,H=150,bw=Math.min(50,(W-40)/rows.length-8);return `<div class="xp-chart"><b>نمودار ${head[col]}</b><svg viewBox="0 0 ${W} ${H+40}"><line x1="30" y1="${H}" x2="${W-5}" y2="${H}" stroke="var(--muted)"/><line x1="30" y1="5" x2="30" y2="${H}" stroke="var(--muted)"/>${rows.map((r,i)=>{const h=vals[i]/max*(H-20),x=40+i*((W-50)/rows.length);return `<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" fill="var(--u)" opacity=".8" rx="4"/><text x="${x+bw/2}" y="${H-h-4}" font-size="10" text-anchor="middle" fill="var(--ink)">${faE(vals[i]%1?vals[i].toFixed(2):vals[i])}</text><text x="${x+bw/2}" y="${H+14}" font-size="9" text-anchor="middle" fill="var(--ink)">${escE(r[0].slice(0,10))}${r.length>2&&col!==1?' · '+escE(r[1].slice(0,6)):''}</text>`}).join('')}</svg><small>الگو را توصیف کن: با تغییر «${head[0]}»، «${head[col]}» چگونه تغییر می‌کند؟</small></div>`};
/* ---- experiment design ---- */
EXTF.design=function(id){const d=EXT.design[id];if(!d)return'';const done=(EXTF.ctx.state.designs||{})[id];return `<section class="content-section design" data-design="${id}"><div class="cs-head"><span class="num">📐</span><h2>طراحی آزمایش منصفانه</h2></div><p>${d.q} نقش هر متغیر را مشخص کن:</p><div class="design-rows">${d.vars.map((v,i)=>`<div class="design-row"><span>${v[0]}</span><select data-dv="${i}"><option value="">انتخاب کن</option><option value="ind">متغیر مستقل (تغییرش می‌دهیم)</option><option value="dep">متغیر وابسته (اندازه می‌گیریم)</option><option value="ctl">ثابت نگه می‌داریم</option></select></div>`).join('')}</div><div class="xp-row"><button type="button" class="fx-btn" data-design-check>بررسی طرح</button>${done?'<span class="design-ok">✓ طرح منصفانه</span>':''}</div><div class="fx-fb" data-design-fb><b>یادآوری: در آزمایش منصفانه فقط یک چیز را تغییر می‌دهیم.</b></div></section>`};
EXTF.checkDesign=function(box){const id=box.dataset.design,d=EXT.design[id],sel=[...box.querySelectorAll('[data-dv]')].map(s=>s.value);const fb=box.querySelector('[data-design-fb]');if(sel.some(v=>!v)){fb.className='fx-fb hint';fb.innerHTML='<b>برای همه‌ی متغیرها نقش انتخاب کن.</b>';return}const ind=sel.filter(v=>v==='ind').length,dep=sel.filter(v=>v==='dep').length;if(ind>1){fb.className='fx-fb bad';fb.innerHTML='<b>بیش از یک متغیر را تغییر داده‌ای!</b><span>آزمایش منصفانه نیست؛ نمی‌فهمی کدام تغییر باعث نتیجه شده.</span>';EXTF.ctx.buzz();return}if(ind===0||dep!==1){fb.className='fx-fb bad';fb.innerHTML='<b>باید دقیقاً یک متغیر مستقل و یک متغیر وابسته داشته باشی.</b>';EXTF.ctx.buzz();return}const wrong=d.vars.map((v,i)=>v[1]!==sel[i]?v[0]:null).filter(Boolean);if(wrong.length){fb.className='fx-fb bad';fb.innerHTML=`<b>نقش این‌ها را دوباره فکر کن:</b><span>${wrong.join('، ')}</span>`;EXTF.ctx.buzz();return}fb.className='fx-fb cheer';fb.innerHTML='<b>آفرین! طرح آزمایش منصفانه است.</b><span>یک چیز تغییر می‌کند، یک چیز اندازه می‌شود و بقیه ثابت‌اند.</span>';const {state,save,cheer}=EXTF.ctx;state.designs=state.designs||{};if(!state.designs[id]){state.designs[id]=true;save();cheer()}EXTF.checkBadges()};
/* ---- misconception + pretest ---- */
EXTF.miscon=function(id){const m=EXT.miscon[id];if(!m)return'';const a=(EXTF.ctx.state.miscon||{})[id];return `<section class="content-section miscon" data-miscon="${id}"><div class="cs-head"><span class="num">🤔</span><h2>درست یا نادرست؟</h2></div><p class="tf-stmt">«${m[0]}»</p><div class="options tf">${['درست','نادرست'].map((o,j)=>`<button class="option ${a!=null?(j===(m[1]?0:1)?'correct':j===a?'wrong':''):''}" data-miscon-ans="${j}" ${a!=null?'disabled':''}>${o}</button>`).join('')}</div>${a!=null?`<div class="feedback ${a===(m[1]?0:1)?'good':'bad'}"><b>${a===(m[1]?0:1)?'درست تشخیص دادی!':'این یک کج‌فهمی رایج است.'}</b><p>${m[2]}</p></div>`:''}</section>`};
EXTF.pretest=function(l){const {state}=EXTF.ctx;const pt=(state.pretest||{})[l.id];const qs=[l.practice.find(q=>q.d==='easy')||l.practice[0],l.practice.find(q=>q.d==='medium')||l.practice[1],l.practice.find(q=>q.d==='hard')||l.practice[2]].filter(Boolean);
 if(pt&&pt.done){const s=pt.score;const rec=s===3?'عالی! پیش‌دانسته‌ات خوب است؛ می‌توانی مستقیم سراغ آزمایش زنده و تمرین‌های چالشی بروی.':s===2?'پایه‌ی خوبی داری. بخش‌های درس را بخوان و روی «اشتباه رایج» دقت کن.':s===1?'پیشنهاد: اول بخش ۱ و ۲ را با خوانش صوتی بخوان، بعد آزمایش زنده را انجام بده و در پایان خودآزمایی.':'اشکالی ندارد؛ این درس تازه است. از معرفی شروع کن، هر بخش را بخوان، واژه‌ها را ببین و بعد آزمایش زنده را با حوصله انجام بده.';return `<section class="pretest done"><div class="cs-head"><span class="num">🧭</span><h2>مسیر پیشنهادی تو</h2></div><p><b>پیش‌آزمون: ${faE(s)} از ${faE(qs.length)}</b> — ${rec}</p><div class="path">${[['📖','خواندن بخش‌ها',s<=1],['🔬','آزمایش زنده',true],['🤔','درست/نادرست',s<=2],['▢','جای خالی',true],['✅','خودآزمایی',true]].map(p=>`<span class="${p[2]?'on':''}">${p[0]} ${p[1]}</span>`).join('')}</div></section>`}
 const i=pt?pt.i:0,q=qs[i];if(!q)return'';return `<section class="pretest" data-pretest="${l.id}"><div class="cs-head"><span class="num">🧭</span><h2>پیش‌آزمون کوتاه (${faE(i+1)} از ${faE(qs.length)})</h2><button class="fx-btn ghost" data-pretest-skip>رد شدن</button></div><p class="hint-p">سه پرسش سریع تا مسیر یادگیری‌ات را پیشنهاد دهیم؛ نمره‌اش در کارنامه نمی‌آید.</p><h3>${q.q}</h3><div class="options">${q.o.map((o,j)=>`<button class="option" data-pretest-ans="${j}">${o}</button>`).join('')}</div></section>`};
EXTF.pretestAnswer=function(lid,j,skip){const {state,save,ding,buzz}=EXTF.ctx;const l=EXTF.ctx.lessonMap.get(lid);state.pretest=state.pretest||{};const pt=state.pretest[lid]=state.pretest[lid]||{i:0,score:0};if(skip){pt.done=true;pt.score=2;save();return}const qs=[l.practice.find(q=>q.d==='easy')||l.practice[0],l.practice.find(q=>q.d==='medium')||l.practice[1],l.practice.find(q=>q.d==='hard')||l.practice[2]].filter(Boolean);const q=qs[pt.i];if(q&&j===q.a){pt.score++;ding()}else buzz();pt.i++;if(pt.i>=qs.length)pt.done=true;save()};
/* ---- spaced review ---- */
EXTF.scheduleMistake=function(m,ok){m.stage=ok?Math.min(INTERVALS.length-1,(m.stage||0)+1):0;m.due=Date.now()+INTERVALS[m.stage]*DAY;m.hits=ok?(m.hits||0)+1:0};
EXTF.dueMistakes=function(){const {state}=EXTF.ctx;const now=Date.now();return state.mistakes.filter(m=>!m.due||m.due<=now)};
EXTF.reviewCard=function(){const due=EXTF.dueMistakes().length;const {state}=EXTF.ctx;if(!state.mistakes.length)return'';return `<section class="review-card ${due?'due':''}"><div><b>🔁 مرور فاصله‌دار</b><p>${due?`${faE(due)} پرسش امروز موعد مرورشان است (فاصله‌ها: ۱، ۳، ۷، ۱۴، ۳۰ روز).`:'امروز مروری نداری؛ آفرین! فردا دوباره سر بزن.'}</p></div>${due?'<button class="button button-primary" data-action="review-start">شروع مرور</button>':'<button class="button button-ghost" data-route="mistakes">دفتر اشتباه‌ها</button>'}</section>`};
/* ---- projects ---- */
EXTF.renderProjects=function(){const {state,units,heading}=EXTF.ctx;state.projects=state.projects||{};return `${heading('پروژه‌های پایان بخش','هر بخش یک پروژه‌ی واقعی در خانه یا مدرسه دارد؛ با چک‌لیست ارزیابی و برگه‌ی راهنمای چاپی.','یادگیری با انجام دادن')}${units.map(u=>{const p=EXT.projects[u.id];if(!p)return'';const st=state.projects[u.id]||[];const done=st.filter(Boolean).length;return `<section class="unit-block" style="--u:${u.color};--u-soft:${u.color}22"><header><span class="unit-icon">${u.icon}</span><div><h2>${p.t}</h2><p>بخش ${faE(u.id)}: ${u.title}</p></div></header><p><b>هدف:</b> ${p.goal}</p><div class="exp-grid"><div><b>مراحل</b><ol>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div><div><b>چک‌لیست ارزیابی (${faE(done)}/${faE(p.check.length)})</b>${p.check.map((c,i)=>`<label class="chk"><input type="checkbox" data-proj="${u.id}" data-i="${i}" ${st[i]?'checked':''}> ${c}</label>`).join('')}</div></div><div class="hero-actions"><button class="button button-secondary" data-route="projectsheet/${u.id}">برگه‌ی راهنمای چاپی</button></div></section>`}).join('')}`};
EXTF.renderProjectSheet=function(uid){const {units}=EXTF.ctx;const u=units.find(x=>String(x.id)===String(uid)),p=u&&EXT.projects[u.id];if(!p)return'<p>پروژه پیدا نشد.</p>';return `<div class="hero-actions no-print"><button class="button button-primary" data-action="print">چاپ</button><button class="button button-ghost" data-route="projects">بازگشت</button></div><article class="paper"><header><div><span>${EXTF.ctx.TITLE}</span><h1>برگه‌ی پروژه: ${p.t}</h1></div><div class="fields"><span>نام: ......................</span><span>کلاس: ........</span><span>تاریخ تحویل: ........</span></div></header><p><b>هدف:</b> ${p.goal}</p><h2>مراحل</h2><ol>${p.steps.map(s=>`<li>${s}<div class="lines"></div></li>`).join('')}</ol><h2>جدول مشاهده‌ها</h2><table class="ptable"><tr><th>ردیف</th><th>مورد</th><th>حدس من</th><th>مشاهده</th></tr>${[1,2,3,4,5].map(i=>`<tr><td>${faE(i)}</td><td></td><td></td><td></td></tr>`).join('')}</table><h2>نتیجه‌گیری</h2><div class="lines big"></div><h2>چک‌لیست ارزیابی</h2>${p.check.map(c=>`<p>☐ ${c}</p>`).join('')}<footer>${EXTF.ctx.CREDIT} · گردآورنده و آموزگار</footer></article>`};
/* ---- lab report ---- */
EXTF.renderReport=function(id){const {state,lessonMap,TITLE,CREDIT}=EXTF.ctx;const l=lessonMap.get(id);if(!l)return'<p>درس پیدا نشد.</p>';const nb=(state.notebook||{})[id]||{},p=EXT.predict[id],name=(state.profileName||'');return `<div class="hero-actions no-print"><button class="button button-primary" data-action="print">چاپ / ذخیره PDF</button><button class="button button-ghost" data-route="lesson/${id}">بازگشت به درس</button></div><article class="paper report"><header><div><span>${TITLE} · گزارش آزمایش</span><h1>${l.experiment.title}</h1></div><div class="fields"><span>نام: ${name||'......................'}</span><span>درس ${faE(l.id)}: ${l.title}</span><span>تاریخ: ${nb.done?new Date(nb.done).toLocaleDateString('fa-IR'):'........'}</span></div></header><h2>۱. پرسش و حدس من</h2><p>${p.q}</p><p><b>حدس:</b> ${nb.pred!=null?p.o[nb.pred]+(nb.pred===p.a?' ✓':' ✗'):'ثبت نشده'}</p><h2>۲. وسایل و روش</h2><p>${l.experiment.materials}</p><ol>${l.experiment.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h2>۳. نتایج (جدول و نمودار)</h2>${nb.table||'<p>هنوز جدولی ثبت نشده؛ آزمایش زنده را کامل کن.</p>'}<div data-report-chart></div><h2>۴. مشاهده‌ی من</h2><p>${nb.obs?escE(nb.obs):'<span class="lines"></span>'}</p><h2>۵. نتیجه‌گیری من</h2><p>${nb.concl?escE(nb.concl):'<span class="lines"></span>'}</p><h2>۶. نتیجه‌ی علمی</h2><p>${nb.concl_auto||l.experiment.result}</p>${(state.challenges||{})[id]?'<p>🏆 چالش آزمایشگاهی این آزمایش انجام شد.</p>':''}<footer>${CREDIT} · گردآورنده و آموزگار</footer></article>`};
/* ---- games ---- */
let GAME=null;
EXTF.renderGames=function(){const {state,heading}=EXTF.ctx;const best=state.games||{};if(GAME)return EXTF.gameView();return `${heading('بازی‌های کوتاه علوم','۶۰ ثانیه فرصت داری؛ هرچه بیش‌تر و درست‌تر، امتیاز بیش‌تر.','بازی و یادگیری')}<div class="lab-grid"><button class="lab-card" data-game="separate"><span>🧲</span><h3>${EXT.games.separate.t}</h3><p>${EXT.games.separate.d||'مورد را ببین و پاسخ درست را انتخاب کن.'} بهترین: ${faE(best.separate||0)}</p></button><button class="lab-card" data-game="chain"><span>🦅</span><h3>${EXT.games.chain.t}</h3><p>${EXT.games.chain.d||'حلقه‌ی گم‌شده‌ی زنجیره را پیدا کن.'}</p></button></div>`};
EXTF.startGame=function(id){GAME={id,score:0,n:0,left:60,cur:null,end:false,start:Date.now()};EXTF.nextQ();GAME.timer=setInterval(()=>{if(!GAME){return}GAME.left=Math.max(0,60-Math.floor((Date.now()-GAME.start)/1000));const t=document.querySelector('[data-game-time]');if(t)t.textContent=faE(GAME.left);if(GAME.left<=0)EXTF.endGame()},250)};
EXTF.nextQ=function(){const g=GAME;if(g.id==='separate'){const it=EXT.games.separate.items[Math.floor(Math.random()*EXT.games.separate.items.length)];const opts=[...new Set([it[1],...EXT.games.separate.opts.sort(()=>Math.random()-.5)])].slice(0,4).sort(()=>Math.random()-.5);g.cur={q:`${EXT.games.separate.lbl||'مخلوط'}: ${it[0]}`,opts,a:it[1]}}else{const ch=EXT.games.chain.chains[Math.floor(Math.random()*EXT.games.chain.chains.length)];const k=Math.floor(Math.random()*ch.length);const all=[...new Set(EXT.games.chain.chains.flat())].filter(x=>!ch.includes(x)).sort(()=>Math.random()-.5).slice(0,3);g.cur={q:ch.map((x,i)=>i===k?'❓':x).join(' ← '),opts:[ch[k],...all].sort(()=>Math.random()-.5),a:ch[k]}}};
EXTF.answerGame=function(v){const g=GAME;if(!g||g.end)return;g.n++;if(v===g.cur.a){g.score+=10;EXTF.ctx.ding()}else{g.score=Math.max(0,g.score-3);EXTF.ctx.buzz()}EXTF.nextQ()};
EXTF.endGame=function(){const g=GAME;if(!g||g.end)return;g.end=true;clearInterval(g.timer);const {state,save,cheer}=EXTF.ctx;state.games=state.games||{};if(g.score>(state.games[g.id]||0)){state.games[g.id]=g.score;cheer()}else if(!(g.id in state.games))state.games[g.id]=g.score;save();EXTF.checkBadges();EXTF.ctx.render()};
EXTF.exitGame=function(){if(GAME){clearInterval(GAME.timer)}GAME=null};
EXTF.gameView=function(){const g=GAME,t=EXT.games[g.id].t;if(g.end)return `${EXTF.ctx.heading('پایان بازی',`${t} · امتیاز: ${faE(g.score)} · پاسخ‌ها: ${faE(g.n)}`,'نتیجه')}<div class="ring" style="--p:${Math.min(100,g.score)}"><strong>${faE(g.score)}</strong></div><div class="hero-actions"><button class="button button-primary" data-game="${g.id}">دوباره</button><button class="button button-ghost" data-game-exit>بازگشت</button></div>`;return `<section class="runner game"><div class="runner-top"><span>${t}</span><span>⏱ <b data-game-time>${faE(g.left)}</b> ثانیه · امتیاز ${faE(g.score)}</span><button class="button button-ghost" data-game-exit>خروج</button></div><h2>${g.cur.q}</h2><div class="options">${g.cur.opts.map(o=>`<button class="option" data-game-ans="${escE(o)}">${o}</button>`).join('')}</div></section>`};
/* ---- badges + map ---- */
EXTF.checkBadges=function(){const {state,save,toast}=EXTF.ctx;state.badges=state.badges||{};let n=0;EXT.badges.forEach(b=>{if(!state.badges[b.id]){let ok=false;try{ok=b.check(state)}catch(e){}if(ok){state.badges[b.id]=Date.now();n++;toast(`${b.i} نشان تازه: ${b.t}`)}}});if(n)save();return n};

EXTF.profiles=function(){const {STORE}=EXTF.ctx;const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k===STORE||k.startsWith(STORE+':'))out.push({key:k,name:k===STORE?'(پیش‌فرض)':k.slice(STORE.length+1)})}return out};
EXTF.summary=function(s,lessons){const q=Object.values(s.quiz||{}),acc=q.length?Math.round(q.filter(x=>x.ok).length/q.length*100):0;return {lessons:(s.completed||[]).length,acc,xp:Object.keys(s.labs||{}).filter(k=>k.startsWith('xp')).length,fx:Object.keys(s.fx||{}).length,exams:(s.exams||[]).length,badges:Object.keys(s.badges||{}).length,days:(s.streakDays||[]).length,mistakes:(s.mistakes||[]).length,weak:EXTF.weak(s,lessons)}};
EXTF.weak=function(s,lessons){return lessons.map(l=>{const qs=l.quiz.map((_,i)=>(s.quiz||{})[`${l.id}-q${i+1}`]).filter(Boolean);const bad=qs.filter(x=>!x.ok).length;return bad>=2?l.title:null}).filter(Boolean)};

EXTF.assignmentsCard=function(){const {state,lessons}=EXTF.ctx;const sh=EXTF.shared();if(!sh.assign.length)return'';const status=a=>{const l=a.lesson;if(a.type==='xp')return !!state.labs['xp'+l];if(a.type==='quiz')return lessons.find(x=>x.id===l).quiz.every((_,i)=>state.quiz[`${l}-q${i+1}`]);if(a.type==='fx')return lessons.find(x=>x.id===l).fx.every((_,i)=>state.fx[`${l}-${i}`]);if(a.type==='report'){const nb=(state.notebook||{})[l];return !!(nb&&nb.obs&&nb.concl)}return false};return `<section class="content-section assign"><div class="cs-head"><span class="num">📌</span><h2>تکلیف‌های من</h2></div><div class="lesson-list">${sh.assign.map(a=>{const l=lessons.find(x=>x.id===a.lesson),ok=status(a),late=Date.now()>a.due;return `<button class="lesson-row" data-route="lesson/${a.lesson}"><span class="lesson-index ${ok?'done':''}">${ok?'✓':faE(a.lesson)}</span><div><h3>${{xp:'آزمایش زنده',quiz:'خودآزمایی',fx:'تمرین جای خالی',report:'گزارش آزمایش'}[a.type]}: ${l?l.title:''}</h3><p>${ok?'انجام شد':late?'⏰ مهلت گذشته':'مهلت: '+new Date(a.due).toLocaleDateString('fa-IR')}</p></div><span class="chev">›</span></button>`}).join('')}</div></section>`};

EXTF.renderParentReport=function(key){const {lessons,TITLE,CREDIT}=EXTF.ctx;let s={};try{s=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const m=EXTF.summary(s,lessons);const week=Date.now()-7*DAY;const qWeek=Object.values(s.quiz||{}).filter(q=>q.at>week),okW=qWeek.filter(q=>q.ok).length;const xpW=Object.keys(s.labs||{}).filter(k=>k.startsWith('xp')).map(k=>lessons.find(l=>l.id===k.slice(2))?.title).filter(Boolean);const days=(s.streakDays||[]).filter(d=>new Date(d).getTime()>week).length;const name=key.includes(':')?key.split(':').slice(1).join(':'):'دانش‌آموز';return `<div class="hero-actions no-print"><button class="button button-primary" data-action="print">چاپ / ارسال</button><button class="button button-ghost" data-route="teacher">بازگشت</button></div><article class="paper"><header><div><span>${TITLE} · گزارش هفتگی برای خانواده</span><h1>${escE(name)}</h1></div><div class="fields"><span>تاریخ: ${new Date().toLocaleDateString('fa-IR')}</span><span>هفته‌ی گذشته</span></div></header><h2>این هفته چه کرد؟</h2><ul><li>${faE(days)} روز با اپ کار کرد.</li><li>${faE(qWeek.length)} پرسش پاسخ داد (${faE(okW)} درست).</li><li>آزمایش‌های زنده‌ی انجام‌شده تاکنون: ${xpW.length?xpW.join('، '):'هنوز هیچ'}.</li><li>در مجموع ${faE(m.lessons)} درس از ${faE(lessons.length)} درس را کامل کرده است.</li></ul><h2>نقاط قوت</h2><p>${m.acc>=75?'دقت پاسخ‌ها بالاست ('+faE(m.acc)+'٪).':m.acc>=50?'دقت پاسخ‌ها متوسط است ('+faE(m.acc)+'٪) و رو به بهبود.':'در حال آشنایی با مطالب است؛ تشویق کنید.'} ${m.xp>=5?'به آزمایش کردن علاقه نشان می‌دهد.':''} ${m.badges?faE(m.badges)+' نشان گرفته است.':''}</p><h2>جاهایی که به کمک نیاز دارد</h2><p>${m.weak.length?'درس‌های '+m.weak.join('، ')+' نیاز به مرور دارند.':'ضعف مشخصی دیده نمی‌شود.'} ${m.mistakes?faE(m.mistakes)+' پرسش در دفتر اشتباه‌ها منتظر مرور است.':''}</p><h2>پیشنهاد برای خانه</h2><p>یک آزمایش ساده از کتاب را با هم انجام دهید (مثلاً ${lessons[Math.min(lessons.length-1,m.lessons)]?.experiment.title}) و از او بخواهید نتیجه را برایتان توضیح دهد. ۱۰ دقیقه مرور روزانه با «مرور فاصله‌دار» کافی است.</p><footer>${CREDIT} · گردآورنده و آموزگار</footer></article>`};

EXTF.speakHighlight=function(root){if(!('speechSynthesis'in window))return false;speechSynthesis.cancel();document.querySelectorAll('.sent.now').forEach(s=>s.classList.remove('now'));const targets=[...root.querySelectorAll('p,li,h2,h3')].filter(el=>!el.closest('.xp,.fx-card,.quiz-card,.nb,button'));if(!targets.length)return false;const sents=[];targets.forEach(el=>{if(el.querySelector('.sent'))return;const text=el.textContent;const parts=text.split(/(?<=[.؟!؛:])\s+/).filter(s=>s.trim());if(el.children.length&&!el.querySelector('.sent')){el.dataset.orig=el.innerHTML}el.innerHTML=parts.map(p=>`<span class="sent">${escE(p)}</span>`).join(' ')});root.querySelectorAll('.sent').forEach(s=>sents.push(s));let i=0;const speakNext=()=>{if(i>=sents.length){sents.forEach(s=>s.classList.remove('now'));return}const s=sents[i];sents.forEach(x=>x.classList.remove('now'));s.classList.add('now');s.scrollIntoView?.({block:'nearest',behavior:'smooth'});const u=new SpeechSynthesisUtterance(s.textContent);u.lang='fa-IR';u.rate=.92;u.onend=()=>{i++;speakNext()};u.onerror=()=>{i++;speakNext()};speechSynthesis.speak(u)};speakNext();return true};

 pointer(st,x,y,type){if(type!=='down')return;const P=this.P;for(const k in P){if(Math.hypot(P[k][0]-x,P[k][1]-y)<22){st.dead[k]=!st.dead[k];if(st.dead[k])st.removed++;st.say=st.dead[k]?`${this.N[k][1]} حذف شد. حالا «۱۰ فصل بگذرد» را بزن.`:`${this.N[k][1]} برگشت.`;return}}},
 P:{grass:[180,225],hopper:[80,170],mouse:[280,170],frog:[80,95],snake:[280,95],eagle:[180,30]},
 N:{grass:['🌿','علف'],hopper:['🦗','ملخ'],mouse:['🐭','موش'],frog:['🐸','قورباغه'],snake:['🐍','مار'],eagle:['🦅','عقاب']},
 E:[['grass','hopper'],['grass','mouse'],['hopper','frog'],['hopper','mouse'],['frog','snake'],['mouse','snake'],['mouse','eagle'],['snake','eagle'],['frog','eagle']],
 on(st,a){if(a==='run'){const base={grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5};for(let s=0;s<10;s++){const p=st.pop,n={};for(const k in p){if(st.dead[k]){n[k]=0;continue}const prey=this.E.filter(e=>e[1]===k).map(e=>e[0]),pred=this.E.filter(e=>e[0]===k).map(e=>e[1]);const food=prey.length?prey.reduce((a,q)=>a+p[q]/base[q],0)/prey.length:1;const hunt=pred.length?pred.reduce((a,q)=>a+p[q]/base[q],0)/pred.length:1;let g=1+0.25*(food-1)-0.25*(hunt-1)-0.08*(p[k]/base[k]-1);n[k]=Math.max(0,Math.min(base[k]*2.5,p[k]*g))}st.pop=n;st.season++}const chg=Object.keys(st.pop).filter(k=>!st.dead[k]).map(k=>[k,st.pop[k]/{grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5}[k]]);const up=chg.filter(c=>c[1]>1.2).map(c=>this.N[c[0]][1]),dn=chg.filter(c=>c[1]<.8).map(c=>this.N[c[0]][1]);st.say=st.removed?`پس از ${faX(st.season)} فصل: ${up.length?'زیاد شدند: '+up.join('، ')+'. ':''}${dn.length?'کم شدند: '+dn.join('، ')+'. ':''}${!up.length&&!dn.length?'تغییر چندانی نشد.':''}`:'بدون حذف، شبکه تقریباً پایدار ماند.';if(st.removed&&st.season>=10)st.done=true}

 tick(st){const P=this.P,base={grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5};return `${this.E.map(([a,b])=>{const slack=st.dead[a]||st.dead[b];return `<path d="M${P[a][0]} ${P[a][1]} Q${(P[a][0]+P[b][0])/2} ${(P[a][1]+P[b][1])/2+(slack?30:0)} ${P[b][0]} ${P[b][1]}" fill="none" stroke="${slack?'#bbb':'#d64d56'}" stroke-width="${slack?2:3}" stroke-dasharray="${slack?'4 4':'0'}"/>`}).join('')}${Object.keys(P).map(k=>{const r=st.dead[k]?0:cl(st.pop[k]/base[k]);return `<g transform="translate(${P[k][0]},${P[k][1]})" style="cursor:pointer" opacity="${st.dead[k]?.3:1}"><circle r="${14+r*8}" fill="${st.pop[k]/base[k]>1.2?'#ffe082':st.pop[k]/base[k]<.8?'#ffcdd2':'#c8e6c9'}" stroke="#666"/><text y="6" font-size="18" text-anchor="middle">${this.N[k][0]}</text>${T(0,32,`${this.N[k][1]} ${faX(Math.round(st.pop[k]))}`,{s:10})}${st.dead[k]?T(0,-18,'✖',{c:'#d64d56',b:1,s:16}):''}</g>`}).join('')}${T(320,250,`فصل ${faX(st.season)}`,{s:10,c:'var(--muted)'})}`},

 on(st,a){const step=()=>{st.day++;const w=st.water,l=st.light;const wf=w===0?0:w>8?.4:1-Math.abs(w-5)/6;const lf=l/10;const sf={soil:1,sand:.5,none:.2}[st.soil||'soil'];const g=wf*lf*sf;st.h=Math.min(100,st.h+g*9);st.health=clx(st.health+(g>.3?.05:-.12))};if(a==='day')step();if(a==='week')for(let i=0;i<7;i++)step();if(a==='day'||a==='week')st.say=st.health<.3?`روز ${faX(st.day)}: گیاه پژمرده شده! ${st.water===0?'آب ندارد.':st.water>8?'آب زیادی دارد؛ ریشه می‌پوسد.':st.light<3?'نور کافی ندارد.':'خاک مناسب ندارد.'}`:`روز ${faX(st.day)}: بلندی ${faX(Math.round(st.h))} · گیاه ${st.health>.7?'سرحال':'کمی ضعیف'} است.`;
  if(a==='place'){if(!st.day)return;st.shelf.push({l:st.light,w:st.water,s:st.soil,d:st.day,h:st.h,ok:st.health});st.day=0;st.h=0;st.health=1;st.say='ثبت شد؛ شرایط را عوض کن و گلدان تازه را امتحان کن.';if(st.shelf.length>=2&&Math.abs(st.shelf[0].h-st.shelf.at(-1).h)>20)st.done=true}if(a==='reset'){st.day=0;st.h=0;st.health=1;st.shelf=[]}},
 tick(st){const plant=(x,h,hp,scale)=>`<g transform="translate(${x},200) scale(${scale})"><path d="M-30 0h60l-6 40h-48z" fill="#b5551d"/>${R(-26,-4,52,8,st.soil==='sand'?'#e0c9a6':st.soil==='none'?'#cfe8ff':'#5d4037')}<path d="M0 0 V${-h}" stroke="${hp>.5?'#2e7d32':'#a1887f'}" stroke-width="4"/>${Array.from({length:Math.floor(h/15)},(_,i)=>`<ellipse cx="${(i%2?14:-14)}" cy="${-15-i*15}" rx="14" ry="7" fill="${hp>.5?'#66bb6a':'#c0a16b'}" transform="rotate(${i%2?-20:20} ${(i%2?14:-14)} ${-15-i*15})"/>`).join('')}${h>60&&hp>.7?`<circle cy="${-h-6}" r="8" fill="#f06292"/>`:''}</g>`;
  return `<circle cx="40" cy="40" r="${10+st.light*1.6}" fill="#ffd54f" opacity="${.2+st.light*.08}"/>${Array.from({length:Math.round(st.water/2)},(_,i)=>`<path d="M${290+i*8} ${30+(performance.now()/20+i*17)%40} q2 6 0 8" stroke="#4f7bd9" fill="none"/>`).join('')}${plant(120,st.h,st.health,1)}${T(120,245,`روز ${faX(st.day)} · بلندی ${faX(Math.round(st.h))}`,{b:1})}${st.shelf.slice(-3).map((b,i)=>plant(230+i*45,b.h,b.ok,.4)).join('')}${st.shelf.length?T(280,245,'گلدان‌های قبلی',{s:10,c:'var(--muted)'}):''}`},
 table:st=>tbl(['نور','آب','خاک','روز','بلندی'],st.shelf.map(b=>[faX(b.l),faX(b.w),{soil:'خاک',sand:'ماسه',none:'بدون خاک'}[b.s||'soil'],faX(b.d),faX(Math.round(b.h))])),conclude:p=>p.conclude||'گیاه برای رشد به نور کافی، آب به اندازه (نه کم، نه زیاد) و خاک مناسب نیاز دارد؛ اگر یکی کم باشد، رشد کم یا گیاه پژمرده می‌شود.'};
/* 7 evaporate: two dishes compare */
SIM.evaporate={ctl:()=>sl('sun','آفتاب',0,10,5)+sl('wind','باد',0,10,0)+segX('area','ظرف',[['wide','پهن'],['narrow','باریک']],'wide')+`<div class="xp-row">${btn('run','یک ساعت بگذرد')}${btn('rec','ثبت')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({sun:5,wind:0,area:'wide',lvl:1,hours:0,log:[]}),say0:()=>'شرایط را انتخاب کن و ساعت‌ها را جلو ببر: آب کِی تمام می‌شود؟',
 on(st,a){if(a==='run'){st.hours++;const r=(0.02+st.sun*.012+st.wind*.008)*(st.area==='wide'?1.5:.7);st.lvl=Math.max(0,st.lvl-r);st.say=st.lvl<=0?`آب تمام شد! پس از ${faX(st.hours)} ساعت آب بخار شد و به هوا رفت.`:`ساعت ${faX(st.hours)}: ${faX(Math.round(st.lvl*100))}٪ آب مانده.`}if(a==='rec'){st.log.push([faX(st.sun),faX(st.wind),st.area==='wide'?'پهن':'باریک',faX(st.hours),faX(Math.round(st.lvl*100))+'٪']);if(st.log.length>=3)st.done=true;st.lvl=1;st.hours=0}if(a==='reset'){st.lvl=1;st.hours=0;st.log=[]}},
 tick(st){const w=st.area==='wide'?200:80,h=st.area==='wide'?40:120,x=180-w/2,y=210-h;return `<circle cx="50" cy="40" r="${10+st.sun*2}" fill="#ffd54f" opacity="${.2+st.sun*.08}"/>${Array.from({length:Math.round(st.wind)},(_,i)=>`<path d="M${240+((performance.now()/10+i*25)%90)} ${40+i*8} q8 -4 16 0" fill="none" stroke="#4f7bd9" stroke-width="2"/>`).join('')}${R(x,y,w,h,'#fff',`stroke="#999" stroke-width="3"`)}${R(x+3,y+3+(h-6)*(1-st.lvl),w-6,(h-6)*st.lvl,'#cfe8ff')}${Array.from({length:Math.round((st.sun+st.wind)/2)},(_,i)=>`<circle cx="${x+20+(i*37)%(w-40)}" cy="${y-10-((performance.now()/30+i*23)%60)}" r="2" fill="#9cc" opacity=".6"/>`).join('')}${T(180,245,`آب مانده: ${faX(Math.round(st.lvl*100))}٪ · ${faX(st.hours)} ساعت`,{b:1})}`},
 table:st=>tbl(['آفتاب','باد','ظرف','ساعت','آب مانده'],st.log),conclude:p=>p.conclude||'آب با گرمای آفتاب، باد و سطح پهن‌تر زودتر بخار می‌شود و به هوا می‌رود؛ همین بخار بعداً ابر و باران می‌شود.'};
/* 8 lever */
SIM.lever={ctl:p=>sl('fulc','جای تکیه‌گاه',1,9,5)+sl('load','بار',1,5,3)+sl('eff','نیروی من',0,10,0)+`<div class="xp-row">${btn('rec','ثبت کم‌ترین نیرو')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({fulc:5,load:3,eff:0,log:[]}),say0:p=>p.say0||'تکیه‌گاه را جابه‌جا کن و نیرویت را کم‌کم زیاد کن تا بار بلند شود. کجا کم‌ترین نیرو لازم است؟',
 on(st,a){if(a==='rec'){const need=this.need(st);if(st.eff<need){st.say=`بار هنوز بلند نشده؛ حداقل ${faX(need)} لازم است.`;return}st.log.push([faX(st.fulc),faX(st.load),faX(need)]);st.eff=0;st.needF=true;if(st.log.length>=3)st.done=true;st.say='ثبت شد.'}if(a==='reset'){st.log=[];st.eff=0;st.needF=true}},
 need:st=>Math.ceil(st.load*st.fulc/(10-st.fulc)),
 tick(st,dt,el){if(st.needF){const i=el.querySelector('[data-x=eff]');if(i){i.value=0;el.querySelector('[data-xo=eff]').textContent='۰'}st.needF=false}const need=this.need(st),up=st.eff>=need;const ang=up?-12:8;if(st.eff>0&&!st.say.startsWith('ثبت'))st.say=up?`بار بلند شد! با تکیه‌گاه در ${faX(st.fulc)}، نیروی ${faX(st.eff)} کافی بود.`:`هنوز نه؛ نیروی بیش‌تر بده یا تکیه‌گاه را به بار نزدیک کن.`;
  const fx=60+st.fulc*24;return `<polygon points="${fx},170 ${fx-18},200 ${fx+18},200" fill="#8b6b3d"/><g transform="rotate(${ang} ${fx} 170)"><rect x="60" y="165" width="240" height="8" fill="#c8a97e" stroke="#8b6b3d"/>${Array.from({length:st.load},(_,i)=>`<rect x="${62+(i%3)*14}" y="${135-Math.floor(i/3)*30}" width="12" height="28" fill="#555"/>`).join('')}<rect x="270" y="${160-st.eff*3}" width="20" height="${st.eff*3+5}" fill="#278c54" opacity=".8"/><text x="280" y="155" font-size="11" text-anchor="middle">${faX(st.eff)}</text></g>${T(70,225,'بار',{s:11})}${T(280,225,'نیروی من',{s:11})}${T(180,250,`نیروی لازم: ${faX(need)}`,{b:1})}`},
 table:st=>tbl(['جای تکیه‌گاه','بار','کم‌ترین نیرو'],st.log),conclude:p=>p.conclude||'هرچه تکیه‌گاه به بار نزدیک‌تر باشد، با نیروی کم‌تری آن را بلند می‌کنیم؛ اهرم کار را آسان می‌کند.'};
/* 9 ramp */
SIM.ramp={ctl:()=>sl('ang','شیب سطح',5,80,30,5,'درجه')+sl('F','نیروی من',0,20,0)+`<div class="xp-row">${btn('rec','ثبت')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({ang:30,F:0,x:0,log:[]}),say0:()=>'جعبه را با نیروی کم بالا ببر: شیب کم یا زیاد؟ نیروی لازم را برای چند شیب ثبت کن.',
 on(st,a){if(a==='rec'){const need=Math.ceil(10*Math.sin(st.ang*Math.PI/180)+2);if(st.F<need){st.say=`جعبه بالا نمی‌رود؛ حداقل ${faX(need)} لازم است.`;return}st.log.push([faX(st.ang)+'°',faX(need),faX(Math.round(100/Math.sin(st.ang*Math.PI/180)))]);if(st.log.length>=3)st.done=true;st.say='ثبت شد.'}if(a==='reset')st.log=[]},
 tick(st,dt){const need=Math.ceil(10*Math.sin(st.ang*Math.PI/180)+2);if(st.F>=need)st.x=Math.min(1,st.x+dt*.4);else st.x=Math.max(0,st.x-dt*.6);const a=st.ang*Math.PI/180,len=200,x0=60,y0=210;const bx=x0+Math.cos(a)*len*st.x,by=y0-Math.sin(a)*len*st.x;if(st.F>0&&!st.say.startsWith('ثبت'))st.say=st.F>=need?`با نیروی ${faX(st.F)} جعبه بالا می‌رود (شیب ${faX(st.ang)} درجه).`:`نیرو کافی نیست؛ برای این شیب ${faX(need)} لازم است. شیب را کم کن یا نیرو را زیاد.`;
  return `<polygon points="${x0},${y0} ${x0+Math.cos(a)*len},${y0-Math.sin(a)*len} ${x0+Math.cos(a)*len},${y0}" fill="#c8a97e" stroke="#8b6b3d"/><g transform="translate(${bx},${by}) rotate(${-st.ang})"><rect x="0" y="-30" width="34" height="30" fill="var(--u)" rx="4"/></g>${T(180,245,`نیروی لازم: ${faX(need)} · طول مسیر: ${faX(Math.round(100/Math.sin(a)))}`,{b:1})}`},
 table:st=>tbl(['شیب','نیروی لازم','طول مسیر'],st.log),conclude:p=>p.conclude||'سطح شیب‌دار با شیب کم، نیروی لازم را کم می‌کند ولی مسیر بلندتر می‌شود؛ این یک ماشین ساده است.'};

SIM.sound={ctl:p=>sl('len','بلندی کِش/سیم',20,100,60,10)+sl('amp','شدت زدن',1,10,5)+segX('mat',[['thin','نازک'],['thick','کلفت']],'thin')+`<div class="xp-row">${btn('pluck','بزن!')}${btn('rec','ثبت')}${btn('reset','از اول','ghost')}</div>`,

 tick(st,dt){st.t+=dt;const vib=st.t<1.5?Math.sin(st.t*40)*st.amp*2*(1.5-st.t):0;const x1=80,x2=80+st.len*2;return `${R(60,60,240,90,'#deb887',`stroke="#8b6b3d" rx="10"`)}<circle cx="180" cy="105" r="30" fill="#5d4037"/><path d="M${x1} 105 Q${(x1+x2)/2} ${105+vib} ${x2} 105" stroke="#333" stroke-width="${st.mat==='thin'?1.5:4}" fill="none"/><rect x="${x1-4}" y="95" width="4" height="20" fill="#333"/><rect x="${x2}" y="95" width="4" height="20" fill="#333"/>${st.t<1.5?Array.from({length:3},(_,i)=>`<circle cx="180" cy="105" r="${40+i*20+st.t*30}" fill="none" stroke="#4f7bd9" opacity="${Math.max(0,1-st.t)*.6}"/>`).join(''):''}${T(180,220,'صدا از لرزش به وجود می‌آید',{s:11,c:'var(--muted)'})}`},
 table:st=>tbl(['بلندی سیم','کلفتی','شدت','صدا'],st.log),conclude:p=>p.conclude||'صدا از لرزش پدید می‌آید: سیم کوتاه و نازک تندتر می‌لرزد و صدای زیر می‌دهد؛ سیم بلند و کلفت صدای بم. محکم‌تر زدن صدا را بلندتر می‌کند، نه زیرتر.'};

/* ---- factory ---- */
function makeSim(tpl,p){const b=SIM[tpl];if(!b)throw new Error('no sim '+tpl);const x={};for(const k in b){const v=b[k];if(typeof v==='function'){if(k==='say0'){x.say0=v.call(x,p);continue}x[k]=function(...args){if(k==='init'||k==='conclude'||k==='ctl')return v.call(x,p);if(k==='table')return v.call(x,args[0]);if(k==='pointer'||k==='seg')return v.call(x,...args);return v.call(x,args[0],args[1],args[2],p)}}else x[k]=v}x.p=p;x.tpl=tpl;return x}
window.SIM=SIM;window.makeSim=makeSim;

 k_group:()=>{const a=ri(3,6),b=ri(2,5),c=ri(1,4);return{rows:[`در بشقاب ${fa(a)} تکه سیب، ${fa(b)} تکه خیار و ${fa(c)} تکه نان است.`,`میوه و سبزی روی هم: ${B(a+b,1,'سیب و خیار را جمع کن.',2)}`,`همه‌ی تکه‌ها: ${B(a+b+c,2,'نان را هم اضافه کن.',2)}`]}},

 m_mix:()=>{const a=ri(20,80),b=ri(10,40);return{rows:[`${fa(a)} گرم ماسه را با ${fa(b)} گرم نمک مخلوط کردیم.`,`جرم مخلوط: ${fa(a)} + ${fa(b)} = ${B(a+b,1,'جرم‌ها را جمع کن؛ در مخلوط چیزی از بین نمی‌رود.',3)} گرم`,`بعد از جدا کردن نمک با آب و تبخیر، چند گرم نمک به دست می‌آید؟ ${B(b,2,'همان مقدار نمک اول.',2)} گرم`]}},
 m_bulb:()=>{const n=ri(2,5),h=ri(2,6);return{rows:[`${fa(n)} لامپ هر شب ${fa(h)} ساعت روشن‌اند.`,`ساعت‌های روشنایی در یک شب: ${fa(n)} × ${fa(h)} = ${B(n*h,1,'ضرب کن.',2)} لامپ‌ساعت`,`در یک هفته: ${B(7*n*h,2,'در ۷ ضرب کن.',3)} لامپ‌ساعت`,`اگر یک لامپ را خاموش کنیم، هر شب چند لامپ‌ساعت کم می‌شود؟ ${B(h,3,'یک لامپ × ساعت.',2)}`]}},
 m_pulse:()=>{const r=ri(70,90),m=ri(2,5);return{rows:[`قلب علی در حالت استراحت هر دقیقه ${fa(r)} بار می‌زند.`,`در ${fa(m)} دقیقه: ${fa(r)} × ${fa(m)} = ${B(r*m,1,'ضرب کن.',3)} بار`,`بعد از دویدن ضربان دو برابر شد: ${B(2*r,2,'دو برابر کن.',3)} بار در دقیقه`]}},
 m_temp:()=>{const a=ri(20,30),k=ri(2,5);return{rows:[`آب ${fa(a)} درجه را روی شعله گذاشتیم؛ هر دقیقه ${fa(k)} درجه گرم‌تر می‌شود.`,`دما بعد از ۵ دقیقه: ${fa(a)} + ۵ × ${fa(k)} = ${B(a+5*k,1,'۵ برابر افزایش را به دمای اول اضافه کن.',3)} درجه`,`چند دقیقه طول می‌کشد تا به ۱۰۰ درجه بجوشد؟ ≈ ${B(Math.ceil((100-a)/k),2,'(۱۰۰ − دمای اول) ÷ افزایش هر دقیقه؛ رو به بالا گرد کن.',3)} دقیقه`]}},
 m_moon:()=>{const d=ri(1,10);return{rows:[`ماه هر حدود ۲۹ روز یک بار به شکل کامل (بدر) دیده می‌شود. امروز ${fa(d)} روز از ماه کامل گذشته است.`,`چند روز تا ماه کامل بعدی مانده؟ ۲۹ − ${fa(d)} = ${B(29-d,1,'از ۲۹ کم کن.',2)}`,`از ماه نو تا ماه کامل حدود چند روز است؟ ${B(15,2,'تقریباً نصف ۲۹؛ حدود ۱۵ روز.',2)}`]}},
 m_rock:()=>{const a=ri(3,9),b=ri(2,6);return{rows:[`در گردش علمی ${fa(a)} سنگ رسوبی و ${fa(b)} سنگ آذرین جمع کردیم.`,`همه‌ی سنگ‌ها: ${B(a+b,1,'جمع کن.',2)}`,`سنگ رسوبی چند تا بیش‌تر است؟ ${B(a-b,2,'کم کن.',2)}`]}},
 m_lever:()=>{const l=ri(2,5),w=ri(2,6);return{rows:[`بار ${fa(w)} کیلویی در فاصله‌ی ۱ متری تکیه‌گاه است و ما ${fa(l)} متر آن‌طرف‌تر فشار می‌دهیم.`,`نیروی لازم تقریباً: ${fa(w)} ÷ ${fa(l)} = ${B(Math.round(w/l*10)/10,1,'بار را بر فاصله تقسیم کن (با یک رقم اعشار).',4)} کیلوگرم‌نیرو`,`اگر فاصله‌ی ما دو برابر شود، نیرو: ${B(Math.round(w/(2*l)*10)/10,2,'نصف قبلی.',4)}`]}},
 m_ramp:()=>{const h=ri(1,3),k=ri(2,5);return{rows:[`سطح شیب‌داری به بلندی ${fa(h)} متر و درازای ${fa(h*k)} متر داریم.`,`درازا چند برابر بلندی است؟ ${fa(h*k)} ÷ ${fa(h)} = ${B(k,1,'تقسیم کن.',2)}`,`پس نیروی لازم حدود یک‌${['','','دوم','سوم','چهارم','پنجم'][k]} وزن جعبه است؛ برای جعبه‌ی ${fa(k*10)} کیلویی: ${B(10,2,'وزن ÷ نسبت.',2)} کیلوگرم‌نیرو`]}},
 m_soil:()=>{const w=ri(200,600),p=pick([25,50,75]);return{rows:[`روی خاک ${fa(w)} میلی‌لیتر آب ریختیم و ${fa(p)}٪ آن از خاک رد شد.`,`آب ردشده: ${fa(w)} × ${fa(p)} ÷ ۱۰۰ = ${B(w*p/100,1,'درصد را حساب کن.',3)} میلی‌لیتر`,`آبی که خاک نگه داشت: ${B(w-w*p/100,2,'از کل کم کن.',3)} میلی‌لیتر`]}},
 m_plant:()=>{const a=ri(2,6),d=ri(2,4);return{rows:[`گیاه در نور هر هفته ${fa(a)} سانتی‌متر و در سایه ${fa(d)} سانتی‌متر رشد کرد.`,`بعد از ۳ هفته گیاه در نور: ${B(3*a,1,'در ۳ ضرب کن.',2)} سانتی‌متر`,`اختلاف دو گیاه بعد از ۳ هفته: ${B(3*(a-d),2,'رشد سه‌هفته‌ای سایه را هم حساب کن و کم کن.',2)} سانتی‌متر`]}},
 m_sound:()=>{const t=ri(2,6);return{rows:[`صدا در هوا هر ثانیه حدود ۳۴۰ متر می‌رود. رعد ${fa(t)} ثانیه بعد از برق شنیده شد.`,`فاصله‌ی ابر: ۳۴۰ × ${fa(t)} = ${B(340*t,1,'ضرب کن.',4)} متر`,`تقریباً چند کیلومتر؟ ${B(Math.round(340*t/100)/10,2,'بر ۱۰۰۰ تقسیم کن (یک رقم اعشار).',4)}`]}},
 m_food:()=>{const a=ri(3,6),b=ri(2,5),c=ri(1,3);return{rows:[`در روز ${fa(a)} واحد میوه و سبزی، ${fa(b)} واحد نان و غلات و ${fa(c)} واحد لبنیات خوردیم.`,`همه‌ی واحدها: ${B(a+b+c,1,'سه عدد را جمع کن.',2)}`,`توصیه‌ی حداقل ۵ واحد میوه و سبزی؛ چند واحد کم داریم؟ ${B(Math.max(0,5-a),2,'۵ منهای مقدار خورده‌شده (اگر منفی شد صفر).',2)}`]}},
 m_bone:()=>{const n=ri(2,6);return{rows:[`بدن انسان بزرگ‌سال ۲۰۶ استخوان دارد؛ هر دست ۲۷ استخوان.`,`دو دست روی هم: ۲۷ × ۲ = ${B(54,1,'دو برابر کن.',2)} استخوان`,`چند استخوان در جاهای دیگر بدن است؟ ۲۰۶ − ۵۴ = ${B(152,2,'کم کن.',3)}`]}},
 m_history:()=>{const y=ri(50,150);return{rows:[`اولین چراغ برق در محله‌ی ما ${fa(y)} سال پیش روشن شد. سال جاری ۱۴۰۵ است.`,`سال روشن شدن: ۱۴۰۵ − ${fa(y)} = ${B(1405-y,1,'از ۱۴۰۵ کم کن.',4)}`,`اگر هر نسل ۳۰ سال باشد، حدود چند نسل پیش؟ ${B(Math.round(y/30),2,'بر ۳۰ تقسیم کن و گرد کن.',2)}`]}}

(()=>{

function tone(list,type='triangle'){if(!state.prefs.sound)return;const c=audio();if(!c)return;let t=c.currentTime;list.forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+0.02);t+=d*0.75})}

V.scene=items=>{const n=items.length,w=Math.max(300,n*90);return `<svg viewBox="0 0 ${w} 150" class="visual" role="img"><rect x="0" y="0" width="${w}" height="150" rx="16" fill="var(--u-soft)"/>${items.map((it,i)=>{const [e,...rest]=it.trim().split(' ');const x=w-(i+.5)*(w/n);return `<text x="${x}" y="78" font-size="46" text-anchor="middle">${e}</text><text x="${x}" y="125" font-size="13" text-anchor="middle" fill="var(--ink)" font-weight="700">${rest.join(' ')}</text>${i<n-1?`<text x="${x-w/n/2}" y="80" font-size="20" text-anchor="middle" fill="var(--muted)">←</text>`:''}`}).join('')}</svg>`};
function visual(name,unit){if(name&&name.startsWith('scene:'))return V.scene(name.slice(6).split('|'));const k=VIS_MAP[name];return k?V[k]():V.generic(unit.icon)}

function renderLabelBody(id){const x=labels.find(l=>l.id===id);if(x.targets){const sh=LABEL_SHAPES[id]||x.shape;return `<section class="labeler" data-labeler="${id}" data-kind="spots"><div class="label-stage">${sh.svg}${sh.spots.map((p,i)=>`<button type="button" class="spot" data-spot="${i}" data-answer="${esc(x.targets[i])}" style="left:${p[0]/sh.w*100}%;top:${p[1]/sh.h*100}%"><span>؟</span></button>`).join('')}</div><div class="label-bank">${shuffle(x.targets).map(t=>`<button type="button" class="tag" draggable="true" data-tag="${esc(t)}">${t}</button>`).join('')}</div><div class="fx-fb" data-fx-fb><b>یک برچسب انتخاب کن و روی نقطه‌ی درست بینداز.</b></div></section>`}

let practiceRun=null;
function renderPractice(){if(!practiceRun)return `${heading('تمرین‌های چندشیوه‌ای','بخش، سطح و شیوه‌ی پاسخ را انتخاب کن؛ چهارگزینه‌ای، درست/نادرست یا پاسخ کوتاه.','کارگاه تمرین')}<section class="fx-entry"><div><span class="eyebrow">گام‌به‌گام</span><h2>تمرین‌های جای خالی با صدای تشویق</h2><p>${fa(lessons.reduce((s,l)=>s+l.fx.length,0))} تمرین کلمه‌ای، عددی و ترتیبی برای موضوع‌های مهم هر درس.</p></div><button class="button button-primary" data-route="fill">شروع</button></section><form id="practiceForm" class="setup"><label>بخش<select name="unit"><option value="all">همه‌ی بخش‌ها</option>${units.map(u=>`<option value="${u.id}">${u.title}</option>`).join('')}</select></label><label>سطح<select name="d"><option value="all">همه</option><option value="easy">ساده</option><option value="medium">متوسط</option><option value="hard">چالشی</option></select></label><label>شیوه<select name="mode"><option value="choice">چهارگزینه‌ای</option><option value="tf">درست / نادرست</option><option value="input">پاسخ کوتاه (تایپ)</option></select></label><label>تعداد<select name="n"><option>۵</option><option selected>۱۰</option><option>۱۵</option></select></label><button class="button button-primary">شروع تمرین</button></form><div class="stats3"><div><strong>${fa(QALL.length)}</strong><small>پرسش در بانک</small></div><div><strong>${fa(state.practice.length)}</strong><small>تمرین انجام‌شده</small></div><div><strong>${fa(state.mistakes.length)}</strong><small>در دفتر اشتباه‌ها</small></div></div>`;
 if(practiceRun.done)return practiceResult();const q=practiceRun.items[practiceRun.i],sel=practiceRun.ans[practiceRun.i];return `<section class="runner"><div class="runner-top"><span>${q.lesson.title} · ${diffLabel(q.d)}</span><span>${fa(practiceRun.i+1)} از ${fa(practiceRun.items.length)}</span><button class="button button-ghost" data-action="p-exit">خروج</button></div><div class="bar"><i style="width:${pct(practiceRun.i,practiceRun.items.length)}%"></i></div><h2>${q.q} ${speakBtn('.runner')}</h2>${practiceResp(q,sel)}${sel?.checked?`<div class="feedback ${sel.ok?'good':'bad'}"><b>${sel.ok?'آفرین!':'پاسخ درست: '+q.o[q.a]}</b><p>${q.e}</p></div><button class="button button-primary" data-action="p-next">${practiceRun.i+1<practiceRun.items.length?'پرسش بعدی':'پایان و کارنامه'}</button>`:`<div class="hero-actions"><button class="button button-primary" data-action="p-check">بررسی پاسخ</button><button class="button button-ghost" data-action="p-hint">راهنما</button></div><div class="hintbox" hidden>💡 ${q.e.split('؛')[0].split('.')[0]}.</div>`}</section>`}
function practiceResp(q,sel){const m=practiceRun.mode;if(m==='choice')return `<div class="options">${q.o.map((o,j)=>{let c='';if(sel?.checked)c=j===q.a?'correct':j===sel.choice?'wrong':'';else if(sel?.choice===j)c='selected';return `<button class="option ${c}" data-action="p-choice" data-choice="${j}" ${sel?.checked?'disabled':''}><span>${['الف','ب','پ','ت'][j]}</span>${o}</button>`}).join('')}</div>`;if(m==='tf')return `<p class="tf-stmt">گزاره: «پاسخ این پرسش <b>${q.o[q.tfIdx]}</b> است.»</p><div class="options tf">${['درست','نادرست'].map((o,j)=>`<button class="option ${sel?.checked?(j===q.tfAns?'correct':j===sel.choice?'wrong':''):sel?.choice===j?'selected':''}" data-action="p-choice" data-choice="${j}" ${sel?.checked?'disabled':''}>${o}</button>`).join('')}</div>`;return `<label class="short"><span>پاسخ را بنویس (یک یا دو کلمه‌ی کلیدی کافی است).</span><input type="text" data-p-input value="${esc(sel?.text||'')}" ${sel?.checked?'disabled':''}></label>`}
function startPractice(fd){let pool=QALL.filter(q=>(fd.unit==='all'||String(q.lesson.unit)===fd.unit)&&(fd.d==='all'||q.d===fd.d));pool=shuffle(pool).slice(0,num(fd.n)).map(q=>{const tfIdx=Math.random()<.5?q.a:pick(q.o.map((_,i)=>i).filter(i=>i!==q.a));return{...q,tfIdx,tfAns:tfIdx===q.a?0:1}});practiceRun={items:pool,i:0,ans:{},mode:fd.mode,done:false,start:Date.now()};render()}
function normalize(s){return String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s‌]+/g,'').toLowerCase()}

document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());if(f.id==='practiceForm')startPractice(fd);else if(f.id==='examForm'){const pool=QALL.filter(q=>fd.unit==='all'||String(q.lesson.unit)===fd.unit);examRun={items:shuffle(pool).slice(0,num(fd.n)),i:0,ans:{},done:false,title:fd.unit==='all'?'آزمون جامع':'آزمون بخش '+unitMap.get(fd.unit).title};render()}else if(f.id==='profForm'){const name=(fd.name||'').trim();if(!name)return;localStorage.setItem(STORE_BASE+'-profile',name);location.reload()}else if(f.id==='assignForm'){const sh=EXTF.shared();sh.assign.push({lesson:fd.lesson,type:fd.type,due:Date.now()+num(fd.days)*86400000,at:Date.now()});EXTF.saveShared(sh);toast('تکلیف افزوده شد.');render()}else if(f.id==='wsForm'){const pool=QALL.filter(q=>fd.unit==='all'||String(q.lesson.unit)===fd.unit);worksheet={items:shuffle(pool).slice(0,num(fd.n)),key:!!fd.key};render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-fx-blank]')){fxCheck(t.closest('.fx-card'),t);return}if(t.matches('[data-lab-input]')){const lab=t.closest('[data-lab]');lab._st[t.name]=t.value;const o=lab.querySelector(`[data-out="${t.name}"]`);if(o)o.textContent=fa(t.value);updateLab(lab);return}if(t.matches('[data-gl-search]')){const v=normalize(t.value);document.querySelectorAll('.gl-card').forEach(c=>c.hidden=v&&!c.dataset.gl.includes(v));return}if(t.matches('[data-access]')){const k=t.dataset.access;state.prefs[k]=t.type==='checkbox'?t.checked:Number(t.value);save();applyPrefs()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('select[data-fx-blank]'))fxCheck(t.closest('.fx-card'),t);else if(t.matches('[data-proj]')){state.projects=state.projects||{};const arr=state.projects[t.dataset.proj]=state.projects[t.dataset.proj]||[];arr[Number(t.dataset.i)]=t.checked;save();if(t.checked)ding();render()}else if(t.matches('[data-import]')&&t.files[0]){const r=new FileReader();r.onload=()=>EXTF.importAll(r.result);r.readAsText(t.files[0])}});
document.addEventListener('dragstart',e=>{const t=e.target.closest?.('.tag');if(t){dragTag=t;e.dataTransfer.setData('text/plain',t.dataset.tag)}});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.spot,.group'))e.preventDefault()});
document.addEventListener('drop',e=>{const s=e.target.closest?.('.spot:not(.filled),.group');if(s&&dragTag){e.preventDefault();placeTag(s.closest('.labeler'),dragTag,s);dragTag=null}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('accessModal').hidden=true;document.body.classList.remove('menu-open')}});
function applyPrefs(){const p=state.prefs;document.documentElement.dataset.theme=p.theme;document.documentElement.dataset.contrast=p.contrast?'high':'';document.documentElement.dataset.motion=p.motion?'reduce':'';document.documentElement.style.setProperty('--fs',(1+p.font*0.1)+'rem');window.__lowPower=!!p.lowPower;document.documentElement.dataset.lowpower=p.lowPower?'1':'';document.querySelectorAll('[data-access]').forEach(i=>{if(i.type==='checkbox')i.checked=!!p[i.dataset.access];else i.value=p[i.dataset.access]||0})}
function download(){return;/*html-download-disabled*/const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=COURSE.file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('hashchange',render);applyPrefs();render();
window.__OLUM={state:()=>state,QALL,LAB,NUMGEN};EXTF.checkBadges();
})();
</script>
<script>/*protections*/document.addEventListener('contextmenu',function(e){e.preventDefault()});document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&(k==='s'||k==='u')){e.preventDefault()}});</script></body></html>
