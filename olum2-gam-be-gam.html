EXTF.renderParentReport=function(key){const {lessons,TITLE,CREDIT}=EXTF.ctx;let s={};try{s=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const m=EXTF.summary(s,lessons);const week=Date.now()-7*DAY;const qWeek=Object.values(s.quiz||{}).filter(q=>q.at>week),okW=qWeek.filter(q=>q.ok).length;const xpW=Object.keys(s.labs||{}).filter(k=>k.startsWith('xp')).map(k=>lessons.find(l=>l.id===k.slice(2))?.title).filter(Boolean);const days=(s.streakDays||[]).filter(d=>new Date(d).getTime()>week).length;const name=key.includes(':')?key.split(':').slice(1).join(':'):'دانش‌آموز';return `<div class="hero-actions no-print"><button class="button button-primary" data-action="print">چاپ / ارسال</button><button class="button button-ghost" data-route="teacher">بازگشت</button></div><article class="paper"><header><div><span>${TITLE} · گزارش هفتگی برای خانواده</span><h1>${escE(name)}</h1></div><div class="fields"><span>تاریخ: ${new Date().toLocaleDateString('fa-IR')}</span><span>هفته‌ی گذشته</span></div></header><h2>این هفته چه کرد؟</h2><ul><li>${faE(days)} روز با اپ کار کرد.</li><li>${faE(qWeek.length)} پرسش پاسخ داد (${faE(okW)} درست).</li><li>آزمایش‌های زنده‌ی انجام‌شده تاکنون: ${xpW.length?xpW.join('، '):'هنوز هیچ'}.</li><li>در مجموع ${faE(m.lessons)} درس از ${faE(lessons.length)} درس را کامل کرده است.</li></ul><h2>نقاط قوت</h2><p>${m.acc>=75?'دقت پاسخ‌ها بالاست ('+faE(m.acc)+'٪).':m.acc>=50?'دقت پاسخ‌ها متوسط است ('+faE(m.acc)+'٪) و رو به بهبود.':'در حال آشنایی با مطالب است؛ تشویق کنید.'} ${m.xp>=5?'به آزمایش کردن علاقه نشان می‌دهد.':''} ${m.badges?faE(m.badges)+' نشان گرفته است.':''}</p><h2>جاهایی که به کمک نیاز دارد</h2><p>${m.weak.length?'درس‌های '+m.weak.join('، ')+' نیاز به مرور دارند.':'ضعف مشخصی دیده نمی‌شود.'} ${m.mistakes?faE(m.mistakes)+' پرسش در دفتر اشتباه‌ها منتظر مرور است.':''}</p><h2>پیشنهاد برای خانه</h2><p>یک آزمایش ساده از کتاب را با هم انجام دهید (مثلاً ${lessons[Math.min(lessons.length-1,m.lessons)]?.experiment.title}) و از او بخواهید نتیجه را برایتان توضیح ده EXTF.speakHighlight=function(root){if(!('speechSynthesis'in window))return false;speechSynthesis.cancel();document.querySelectorAll('.sent.now').forEach(s=>s.classList.remove('now'));const targets=[...root.querySelectorAll('p,li,h2,h3')].filter(el=>!el.closest('.xp,.fx-card,.quiz-card,.nb,button'));if(!targets.length)return false;const sents=[];targets.forEach(el=>{if(el.querySelector('.sent'))return;const text=el.textContent;const parts=text.split(/(?<=[.؟!؛:])\s+/).filter(s=>s.trim());if(el.children.length&&!el.querySelector('.sent')){el.dataset.orig=el.innerHTML}el.innerHTML=parts.map(p=>`<span class="sent">${escE(p)}</span>`).join(' ')});root.querySelectorAll('.sent').forEach(s=>sents.push(s));let i=0;const speakNext=()=>{if(i>=sents.length){sents.forEach(s=>s.classList.remove('now'));return}const s=sents[i];sents.forEach(x=>x.classList.remove('now'));s.classList.add('now');s.scrollIntoView?.({block:'nearest',behavior:'smooth'});const u=new SpeechSynthesisUtterance(s.textContent);u.lang='fa-IR';u.rate=.92;u.onend=()=>{i++;speakNext()};u.onerror=()=>{i++;speakNext()};speechSynthesis.speak(u)};speakNext();return true};

 on(st,a,el){if(a==='mix'){if(st.ph==='pour'||st.ph==='stir')return;st.n=st.salt;st.d=0;st.parts=[];st.ph=st.n?'pour':'done';st.t=0;st.spawn=st.n*6;if(!st.n){st.d=1;st.say='آب ساده است. حالا تخم‌مرغ را بینداز.'}else st.say='نمک ته لیوان می‌رود… بعد با قاشق هم می‌زنیم تا حل شود.'}

  if(st.egg){const ay=st.y<TOP?600:(RHO-rho)*6000-4*st.vy;st.vy+=ay*dt;st.y+=st.vy*dt;if(st.y>=BOT){st.y=BOT;st.vy=0}if(st.y<=TOP&&st.vy<0&&rho>RHO){st.y=TOP;st.vy=0}
   if(!st.said&&Math.abs(st.vy)<3&&(st.y>=BOT||st.y<=TOP+1||(st.y>TOP+2&&Math.abs(rho-RHO)<.005))){st.said=true;const o=rho<RHO-.004?'فرو رفت و ته لیوان نشست؛ آب از تخم‌مرغ سبک‌تر است.':rho>RHO+.004?'روی آب شناور ماند؛ آب نمک از تخم‌مرغ چگال‌تر است.':'وسط آب معلق ماند؛ چگالی آب و تخم‌مرغ تقریباً برابر شد!';st.say=`با ${faX(st.n)} قاشق نمک: تخم‌مرغ ${o}`;st.tried.add(rho<RHO-.004?'sink':'float');st.log.push([{water:'آب',hot:'آب داغ',alcohol:'الکل',sugar:'آب شکر'}[st.liq||'water']+' + '+faX(st.n)+' قاشق نمک',rho.toFixed(2),rho<RHO-.004?'فرو رفت':rho>RHO+.004?'شناور':'معلق']);if(st.tried.size===2)st.done=true}}

 tick(st,dt){st.t=Math.max(0,st.t-dt);if(st.ph==='lift')st.t+=dt*2;if(st.ph==='dry'){st.dryT=Math.min(1,st.dryT+dt/3);if(st.dryT>=1&&!st.said){st.said=true;const q=st.quality;const desc=q<.4?'پر از تکه و سوراخ، خیلی زبر و شکننده':q<.75?'زبر و کدر ولی یکپارچه؛ قابل نوشتن':'نسبتاً صاف و یکدست؛ کاغذ بازیافتی خوب';st.say=`کاغذ آماده شد: ${desc}. (کیفیت ${faX(Math.round(q*100))}٪)`;st.trials.push([faX(st.soak)+' ساعت',faX(st.blend)+' بار',faX(st.press),faX(Math.round(q*100))+'٪']);if(st.trials.length>=2&&Math.max(...st.trials.map(r=>parseInt(r[3].replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))))>=60)st.done=true}}

 tick(st,dt){if(st.ph==='erupt'){st.t+=dt;const dur=1+st.gas/60,k=st.t<dur?cl(st.t/.6):Math.max(0,1-(st.t-dur)/1.5);st.lava=k*st.gas/200;st.peak=Math.max(st.peak,st.lava);if(Math.random()<k*.9)st.bub.push({x:160+(Math.random()-.5)*14,y:180,v:60+Math.random()*80*k,r:2+Math.random()*3});if(st.t>dur+1.6){st.ph='idle';const h=Math.round(st.peak*100);st.log.push([faX(st.soda),faX(st.vin),faX(h)+'٪',st.gas?st.limit:'—']);st.say=st.gas?`فوران تمام شد؛ بزرگی فوران ${faX(h)}٪. مادهٔ محدودکننده: ${st.limit} (${st.limit==='جوش‌شیرین'?'سرکه اضافه آمد':st.limit==='سرکه'?'جوش‌شیرین اضافه ماند':'دقیقاً به اندازه'}). مقدارها را عوض کن و دوباره امتحان کن.`:st.say;if(st.log.filter(r=>r[3]!=='—').length>=3)st.done=true}}

  return `<path d="M40 220L140 70h40l100 150Z" fill="#8b5a3c"/>${R(145,70,30,150,'#fff',`stroke="#999" opacity=".6"`)}${R(147,190,26,28,'#f8bbd0')}${st.bub.map(b=>`<circle cx="${b.x}" cy="${b.y}" r="${b.r}" fill="#fff" stroke="#e57373"/>`).join('')}${lv>0?`<path d="M148 70q12 -${lv*60} 24 0 q${lv*40} 0 ${lv*90} ${lv*150}l-${lv*25} 0z" fill="#e53935" opacity=".9"/><path d="M160 70q-${lv*50} 20 -${lv*100} ${lv*150}l${lv*18} 0z" fill="#ff7043"/>`:''}${st.ph==='idle'&&st.t===0?`<g transform="translate(220,30) rotate(-30)"><rect width="16" height="40" fill="#e0f2f1" stroke="#999"/></g>`:''}<g transform="translate(20,40)">${R(0,0,14,150,'var(--line)',`rx="7"`)}${R(0,150-st.peak*150,14,st.peak*150,'#d64d56',`rx="7"`)}${T(7,168,'بزرگی فوران',{s:10})}</g>${T(180,248,`جوش‌شیرین ${faX(st.soda)} قاشق + سرکه ${faX(st.vin)} میلی‌لیتر`,{s:11,c:'var(--muted)'})}`},
 table:st=>tbl(['جوش‌شیرین','سرکه','بزرگی فوران','ماده‌ای که تمام شد'],st.log),

/* 5 plates */
'5':{ctl:()=>segX('mode',[['conv','به هم فشار بده'],['div','از هم دور کن'],['slip','کنار هم بلغزان']],'conv')+sl('f','مقدار حرکت',0,100,0,1,'٪')+`<div class="xp-row">${btn('reset','از اول','ghost')}</div>`,
 init:()=>({mode:'conv',f:0,quake:0,seis:Array(60).fill(0),lastSlip:0,seen:new Set(),energy:0}),
 say0:'یک حالت را انتخاب کن و لغزنده‌ی «مقدار حرکت» را کم‌کم زیاد کن؛ ببین سطح آرد چه شکلی می‌شود.',
 tick(st,dt){const f=st.f/100;if(f>.3)st.seen.add(st.mode);if(st.seen.size===3)st.done=true;
  if(st.mode==='slip'){st.energy+=Math.abs(f-st.lastSlip)*10;st.lastSlip=f;if(st.energy>1.5&&Math.random()<.2){st.quake=Math.min(1,st.energy/3);st.energy=0;st.quakes=(st.quakes||0)+1}}st.quake*=Math.exp(-dt*3);st.seis.push(st.quake*Math.sin(performance.now()/25)*30);st.seis.shift();
  st.say=st.mode==='conv'?(f<.2?'دو ورقه آرام به هم نزدیک می‌شوند…':f<.6?'سطح شروع به چین خوردن کرده است: این‌گونه کوه‌ها ساخته می‌شوند.':'چین‌خوردگی بلند شد؛ رشته‌کوه (مثل زاگرس و البرز) از فشار ورقه‌ها پدید می‌آید.'):st.mode==='div'?(f<.2?'ورقه‌ها کمی از هم فاصله می‌گیرند…':f<.6?'شکاف باز شد؛ مواد داغ زیرین می‌توانند بالا بیایند.':'دره/کف اقیانوس جدید ساخته شد؛ در وسط اقیانوس‌ها همین اتفاق می‌افتد.'):(st.quake>.2?'لرزش! ورقه‌ها گیر کرده بودند و ناگهان رها شدند: زمین‌لرزه.':'ورقه‌ها کنار هم می‌لغزند؛ لغزنده را تکان بده تا انرژی جمع شود و ناگهان آزاد شود.');
  const dx=st.mode==='conv'?f*30:0,gap=st.mode==='div'?f*60:0,sy=st.mode==='slip'?f*40:0,q=st.quake*4;
  const fold=st.mode==='conv'?`<path d="M${120+dx} 108 ${Array.from({length:7},(_,i)=>`Q${125+dx+i*14} ${108-f*45*(i%2?1:0)} ${132+dx+i*14} 108`).join(' ')}" fill="#f5f5f5" stroke="#999"/>`:'';
  return `${R(20,150,320,12,'#999')}<g transform="translate(${Math.sin(performance.now()/30)*q},${Math.cos(performance.now()/40)*q})">${R(30+dx-gap/2,110,140,40,'#ffe082',`stroke="#c9a227"`)}${R(30+dx-gap/2,105,140,6,'#f5f5f5')}${R(180-dx+gap/2,110-sy*0,140,40,'#ffcc80',`stroke="#c9a227"`)}${R(180-dx+gap/2,105,140,6,'#f5f5f5')}${st.mode==='slip'?`<g transform="translate(0,${-sy})">${R(180,110,140,40,'#ffcc80',`stroke="#c9a227"`)}${R(180,105,140,6,'#f5f5f5')}${R(180,100,140,5,'#8d6e63')}${T(250,135,'↓',{s:18})}</g>${R(30,100,140,5,'#8d6e63')}${T(100,135,'↑',{s:18})}`:''}${fold}${gap?`${R(175-gap/2,105,gap,45,'#5d4037')}${R(175-gap/2,150,gap,4,'#e53935')}`:''}</g>${st.mode==='slip'?`<polyline points="${st.seis.map((v,i)=>`${40+i*4.6},${215+v}`).join(' ')}" fill="none" stroke="#d64d56" stroke-width="2"/>${T(180,250,'لرزه‌نگار',{s:10,c:'var(--muted)'})}`:T(180,205,st.mode==='conv'?`ارتفاع چین: ${faX(Math.round(f*45))} میلی‌متر`:`پهنای شکاف: ${faX(Math.round(gap))} میلی‌متر`,{b:1})}`},
 conclude:()=>'ورقه‌های زمین سه جور حرکت می‌کنند: به هم (کوه‌سازی)، از هم (شکاف و کف اقیانوس تازه) و کنار هم (گیر کردن و رها شدن ناگهانی = زمین‌لرزه).'},
/* 6 force meter */
'6':{ctl:()=>sl('k','سفتی کِش',1,3,2,1)+`<div class="xp-row">${btn('add','+ یک وزنه')}${btn('rem','− یک وزنه')}${btn('mark','علامت بزن و ثبت کن')}${btn('reset','از اول','ghost')}</div>`,

 say0:'اول بدون وزنه «علامت بزن» (نقطه‌ی صفر). بعد هر بار یک وزنه اضافه کن و ثبت کن. سفتی کِش را هم می‌توانی عوض کنی.',
 on(st,a){if(a==='add'){st.n=Math.min(6,st.n+1);st.say=`${faX(st.n)} وزنه آویزان است؛ وقتی کِش آرام شد «ثبت» کن.`}if(a==='rem')st.n=Math.max(0,st.n-1);if(a==='mark'){if(Math.abs(st.vel)>3){st.say='صبر کن تا کِش از نوسان بایستد.';return}const l=Math.round(st.len);if(st.zero==null){st.zero=l;st.say='نقطه‌ی صفر علامت زده شد. حالا وزنه اضافه کن.';return}st.log.push([faX(st.n),faX(l-st.zero)+' میلی‌متر',faX(st.n*10)+' نیوتن']);st.ks=st.ks||new Set();st.ks.add(st.k);st.say=`ثبت شد: ${faX(st.n)} وزنه ← ${faX(l-st.zero)} میلی‌متر کشیدگی.`;if(st.log.length>=3)st.done=true}
  if(a==='reset')Object.assign(st,{n:0,len:60,vel:0,zero:null,log:[]})},
 tick(st,dt){const target=60+st.n*(45/st.k);const acc=(target-st.len)*40-st.vel*4;st.vel+=acc*dt;st.len+=st.vel*dt;const len=st.len;
  return `${R(60,20,14,200,'#fbe9a6',`stroke="#c9a227"`)}${Array.from({length:20},(_,i)=>`<line x1="60" y1="${25+i*10}" x2="${i%5?66:72}" y2="${25+i*10}" stroke="#666"/>`).join('')}<path d="M110 20 ${Array.from({length:12},(_,i)=>`L${110+(i%2?6:-6)} ${20+(i+1)*len/12}`).join(' ')}" fill="none" stroke="#d64d56" stroke-width="3"/><path d="M95 ${20+len}h30l4 30h-38z" fill="#c8a97e" stroke="#8b6b3d"/>${Array.from({length:st.n},(_,i)=>`<circle cx="110" cy="${44+len-(i%3)*10}" r="${6+Math.floor(i/3)*3}" fill="#555" stroke="#222"/>`).join('')}${st.zero!=null?`<line x1="80" y1="${20+st.zero}" x2="150" y2="${20+st.zero}" stroke="#278c54" stroke-dasharray="4 3"/>${T(155,24+st.zero,'صفر',{a:'start',c:'#278c54',s:11})}`:''}<line x1="80" y1="${20+len}" x2="150" y2="${20+len}" stroke="#d64d56" stroke-dasharray="4 3"/>${T(155,24+len,st.zero!=null?`${faX(Math.round(len-st.zero))} mm`:'',{a:'start',c:'#d64d56',s:11})}<g transform="translate(200,40)"><line x1="0" y1="140" x2="140" y2="140" stroke="#666"/><line x1="0" y1="0" x2="0" y2="140" stroke="#666"/>${st.log.map((r,i)=>{const n=parseInt(r[0].replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))),mm=parseInt(r[1].replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));return `<circle cx="${n*20}" cy="${140-mm}" r="5" fill="var(--u)"/>`}).join('')}${T(70,160,'تعداد وزنه →',{s:10})}${T(-4,-6,'کشیدگی',{s:10,a:'start'})}</g>`},
 table:st=>tbl(['وزنه','کشیدگی','نیرو'],st.log),
 conclude:()=>'با هر وزنه، کِش تقریباً به یک اندازه بیش‌تر کشیده می‌شود (نقطه‌ها روی یک خط راست‌اند)؛ پس طول کِش می‌تواند نیرو را اندازه بگیرد. کِش سفت‌تر برای همان وزنه کم‌تر کشیده می‌شود.'},

'7':{ctl:()=>segX('surf',[['table','میز صاف'],['card','مقوا'],['carpet','فرش']],'table')+segX('wheel',[['no','بدون چرخ'],['yes','با چرخ (چه می‌شود؟)']],'no')+sl('m','وزنه‌های داخل جعبه',0,4,0)+sl('F','نیروی کشش',0,30,0,1,'نیوتن')+`<div class="xp-row">${btn('rec','ثبت کم‌ترین نیروی حرکت')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({surf:'table',wheel:'no',m:0,F:0,x:60,v:0,moving:false,log:[],minF:null}),
 say0:'سطح را انتخاب کن و نیروی کشش را آرام زیاد کن تا جعبه راه بیفتد. کم‌ترین نیرویی که جعبه را حرکت داد ثبت کن.',
 on(st,a){if(a==='rec'){if(st.minF==null){st.say='جعبه هنوز حرکت نکرده؛ نیرو را بیش‌تر کن.';return}const name={table:'میز صاف',card:'مقوا',carpet:'فرش'}[st.surf];st.log.push([name,faX(st.m),faX(st.minF)+' نیوتن']);st.say=`ثبت شد: ${name} با ${faX(st.m)} وزنه ← ${faX(st.minF)} نیوتن.`;st.minF=null;st.x=60;st.F=0;st.needF=true;if(new Set(st.log.map(r=>r[0])).size>=3)st.done=true}

 tick(st,dt,el){if(st.needF){const i=el.querySelector('[data-x=F]');if(i){i.value=0;el.querySelector('[data-xo=F]').textContent='۰'}st.needF=false}const mu={table:.12,card:.3,carpet:.55}[st.surf]*(st.wheel==='yes'?.3:1),W=(2+st.m*1.5)*10,fs=mu*W;st.moving=st.F>fs;if(st.moving){if(st.minF==null)st.minF=st.F;st.v=Math.min(120,(st.F-fs)*6);st.x+=st.v*dt;if(st.x>250)st.x=60}else st.v=0;
  if(st.F>0)st.say=st.moving?`جعبه حرکت کرد! نیروی کشش ${faX(st.F)} نیوتن از اصطکاک (${faX(Math.round(fs))} نیوتن) بیش‌تر است.`:`جعبه هنوز نمی‌جنبد؛ اصطکاک ایستایی (${faX(Math.round(fs))} نیوتن) با نیروی تو برابری می‌کند. بیش‌تر بکش.`;
  const col={table:'#e0e0e0',card:'#c8a97e',carpet:'#d64d56'}[st.surf];return `${R(20,160,320,16,col)}${st.surf==='carpet'?Array.from({length:32},(_,i)=>`<line x1="${22+i*10}" y1="160" x2="${26+i*10}" y2="153" stroke="#d64d56" stroke-width="2"/>`).join(''):''}${R(st.x,120,60,40,'var(--u)',`rx="4"`)}${Array.from({length:st.m},(_,i)=>`<circle cx="${st.x+12+i*12}" cy="110" r="8" fill="#555"/>`).join('')}${st.wheel==='yes'?`<circle cx="${st.x+12}" cy="160" r="7" fill="#333"/><circle cx="${st.x+48}" cy="160" r="7" fill="#333"/>`:''}<line x1="${st.x+60}" y1="140" x2="${st.x+60+st.F*2}" y2="140" stroke="#278c54" stroke-width="5" stroke-linecap="round"/>${T(st.x+62+st.F*2,132,`${faX(st.F)} N`,{a:'start',c:'#278c54',b:1,s:11})}<line x1="${st.x}" y1="150" x2="${st.x-Math.min(st.F,fs)*2}" y2="150" stroke="#d64d56" stroke-width="5" stroke-linecap="round"/>${T(st.x-Math.min(st.F,fs)*2-4,146,'اصطکاک',{a:'end',c:'#d64d56',s:10})}${T(180,210,`وزن جعبه: ${faX(W)} نیوتن · اصطکاک ایستایی: ${faX(Math.round(fs))} نیوتن`,{s:11})}${st.minF!=null?T(180,235,`کم‌ترین نیروی حرکت: ${faX(st.minF)} نیوتن`,{b:1}):''}`},

'8':{ctl:()=>sl('turns','تعداد پیچش کِش',0,20,5)+segX('surf',[['tile','کاشی'],['wood','چوب'],['carpet','فرش']],'tile')+`<div class="xp-row">${btn('go','رها کن!')}${btn('reset','از اول','ghost')}</div>`,

 on(st,a){if(a==='go'){if(st.run)return;st.x=20;st.E=st.turns*1.0;st.v=0;st.run=true;st.dist=0;st.say='ماشین رها شد…'}if(a==='reset')Object.assign(st,{x:20,v:0,run:false,log:[]})},
 tick(st,dt){const mu={tile:.6,wood:1.0,carpet:2.2}[st.surf];if(st.run){if(st.E>0){const push=Math.min(st.E,8*dt*3);st.v+=push*30;st.E-=push}st.v-=mu*st.v*dt*1.5+mu*8*dt;if(st.v<=0&&st.E<=0){st.v=0;st.run=false;const name={tile:'کاشی',wood:'چوب',carpet:'فرش'}[st.surf];st.log.push([faX(st.turns),name,faX(Math.round(st.dist))+' سانتی‌متر']);st.say=`ماشین روی ${name} با ${faX(st.turns)} پیچش ${faX(Math.round(st.dist))} سانتی‌متر رفت.`;if(st.log.length>=3)st.done=true}st.x+=st.v*dt;st.dist+=st.v*dt*1.5;st.wheel+=st.v*dt*6;if(st.x>300){st.x=300}}

 tick(st,dt){const torque=st.wind*1.2-st.load*1.6;st.w=Math.max(0,st.w+(torque-st.w*.8)*dt*3);st.rot+=st.w*dt*60;st.h=cl(st.h+(st.w>0?st.w*dt*.15:-dt*.4));if(st.wind>0)st.seen.add(st.load);if(st.seen.size>=2&&st.h>=1)st.done=true;
  st.say=st.wind===0?'بادی نیست؛ فرفره ساکن است.':st.w<=0.01?`باد کافی نیست تا ${faX(st.load)} گیره را بالا بکشد؛ باد را بیش‌تر کن یا گیره کم کن.`:st.h>=1?'گیره تا بالا کشیده شد: انرژی حرکتی باد ← چرخش ← انرژی پتانسیل گیره.':'فرفره می‌چرخد و نخ دور محور می‌پیچد؛ گیره بالا می‌رود…';
  const y=L(230,110,st.h);return `${R(150,90,20,160,'#fbe9a6',`stroke="#c9a227"`)}<g transform="rotate(${st.rot} 160 90)">${[0,90,180,270].map(a=>`<path d="M160 90 l0 -44 l28 14z" fill="${['#e53935','#1e88e5','#fdd835','#43a047'][a/90]}" transform="rotate(${a} 160 90)"/>`).join('')}<circle cx="160" cy="90" r="5" fill="#333"/></g><line x1="167" y1="92" x2="225" y2="${y}" stroke="#333"/>${Array.from({length:st.load},(_,i)=>`<path d="M${220+i*4} ${y+i*3}h10v22h-10z" fill="none" stroke="#333" stroke-width="2"/>`).join('')}${Array.from({length:Math.round(st.wind)},(_,i)=>`<path d="M${30+((performance.now()/8+i*30)%90)} ${60+i*9} q10 -5 20 0" fill="none" stroke="#4f7bd9" stroke-width="2" opacity=".6"/>`).join('')}<text x="20" y="100" font-size="26">${st.wind?'💨':''}</text><g transform="translate(300,110)">${R(0,0,12,120,'var(--line)',`rx="6"`)}${R(0,120-st.h*120,12,st.h*120,'#278c54',`rx="6"`)}${T(6,140,'ارتفاع گیره',{s:10})}</g>${T(160,20,`سرعت چرخش: ${faX(Math.round(st.w*10))}`,{s:11,c:'var(--muted)'})}`},
 conclude:()=>'باد قوی‌تر فرفره را تندتر می‌چرخاند و می‌تواند بار سنگین‌تری را بالا بکشد: انرژی حرکتی باد به انرژی چرخشی و سپس انرژی پتانسیل تبدیل می‌شود؛ توربین بادی همین انرژی را به برق تبدیل می‌کند.'},
/* 10 mold */
'10':{ctl:()=>sl('moist','رطوبت نان',0,10,5)+sl('temp','دمای محل نگهداری',0,40,25,1,'درجه')+`<div class="xp-row">${btn('day','یک روز بگذرد')}${btn('week','یک هفته بگذرد')}${btn('place','این نان را کنار بگذار و نان تازه بردار')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({moist:5,temp:25,day:0,g:0,shelf:[],anim:0}),
 say0:'رطوبت و دما را تنظیم کن و روزها را جلو ببر. سپس با شرایط دیگر روی نان تازه تکرار کن و مقایسه کن.',
 rate(st){const m=st.moist/10,t=st.temp<4?0.05:st.temp>38?0.2:Math.exp(-Math.pow((st.temp-28)/10,2));return m*t},
 on(st,a){const step=()=>{st.day++;const r=this.rate(st);st.g=cl(st.g+r*(0.35)*(0.3+st.g))};if(a==='day')step();if(a==='week')for(let i=0;i<7;i++)step();if(a==='day'||a==='week'){st.say=st.g<.05?`روز ${faX(st.day)}: هنوز کپکی دیده نمی‌شود.`:st.g<.4?`روز ${faX(st.day)}: چند لکه‌ی کوچک سبز/خاکستری پیدا شده.`:`روز ${faX(st.day)}: کپک بیش‌تر نان را پوشانده!`}
  if(a==='place'){if(!st.day)return;st.shelf.push({m:st.moist,t:st.temp,d:st.day,g:st.g});st.day=0;st.g=0;st.say='نان کنار گذاشته شد؛ حالا شرایط را عوض کن و نان تازه را آزمایش کن.';if(st.shelf.length>=2&&Math.abs(st.shelf[0].g-st.shelf[st.shelf.length-1].g)>.3)st.done=true}
  if(a==='reset')Object.assign(st,{day:0,g:0,shelf:[]})},
 tick(st,dt){st.anim+=dt;const bread=(x,y,w,g,label,small)=>`<rect x="${x-w/2}" y="${y}" width="${w}" height="${w*.7}" rx="${w*.12}" fill="#f0d9a8" stroke="#b58a3c"/>${Array.from({length:Math.round(g*14)},(_,i)=>`<circle cx="${x-w/2+6+(i*23)%(w-12)}" cy="${y+6+(i*17)%(w*.7-12)}" r="${(2+(i%3))*(0.5+g)*(w/80)}" fill="${i%2?'#6b8e23':'#4a4a6a'}" opacity=".85"/>`).join('')}${T(x,y+w*.7+14,label,{s:small?9:11})}`;
  return `${bread(110,50,120,st.g,`نان کنونی · روز ${faX(st.day)}`)}${T(110,150,`رطوبت ${faX(st.moist)} · دما ${faX(st.temp)}°`,{s:11,c:'var(--muted)'})}${st.temp>30?`<circle cx="60" cy="30" r="14" fill="#ffd54f"/>`:st.temp<8?`<text x="50" y="40" font-size="22">❄️</text>`:''}${st.shelf.slice(-3).map((b,i)=>bread(250,20+i*78,60,b.g,`رطوبت ${faX(b.m)}، ${faX(b.t)}°، روز ${faX(b.d)}`,true)).join('')}${T(250,10,'نان‌های قبلی',{s:10,c:'var(--muted)'})}${T(110,190,`پوشش کپک: ${faX(Math.round(st.g*100))}٪`,{b:1})}`},
 table:st=>tbl(['رطوبت','دما','روز','کپک'],st.shelf.map(b=>[faX(b.m),faX(b.t)+'°',faX(b.d),faX(Math.round(b.g*100))+'٪'])),
 conclude:()=>'کپک (یک قارچ) روی نان مرطوب و در جای گرم زود و زیاد رشد می‌کند؛ نان خشک یا سرد (یخچال) دیرتر کپک می‌زند. برای آزمایش درست، هر بار فقط یک چیز را تغییر بده.'},
/* 11 starch in leaf */
'11':{ctl:()=>sl('foil','جای فویل روی برگ',0,100,40,1,'٪')+sl('days','روزهای نور دیدن',0,3,2,1,'روز')+segX('light',[['sun','در آفتاب'],['dark','در تاریکی']],'sun')+`<div class="xp-row">${btn('boil','۱. آب جوش')}${btn('alc','۲. الکل گرم')}${btn('iod','۳. محلول ید')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({foil:40,days:2,light:'sun',ph:'setup',t:0,trials:[]}),
 say0:'فویل را جابه‌جا کن، مدت نور دیدن را انتخاب کن و بعد سه مرحله‌ی آزمایش را به ترتیب انجام بده.',
 on(st,a){if(a==='boil'&&st.ph==='setup'){st.ph='boil';st.t=0;st.say='برگ در آب جوش نرم شد و سلول‌هایش باز شدند.'}else if(a==='alc'&&st.ph==='boil'){st.ph='alc';st.t=0;st.say='سبزینه وارد الکل می‌شود؛ برگ رنگ‌پریده می‌شود تا رنگ ید دیده شود.'}else if(a==='iod'&&st.ph==='alc'){st.ph='iod';st.t=0;const starch=st.light==='sun'?cl(st.days/2):0;st.starch=starch;st.say=starch===0?'کل برگ قهوه‌ای ماند: بدون نور، نشاسته‌ای ساخته نشده بود.':`قسمت نوردیده آبی‌تیره شد (نشاسته دارد) و زیر فویل قهوه‌ای ماند.${st.days<2?' چون کم‌تر نور دیده، رنگ کم‌رنگ‌تر است.':''}`;st.trials.push([st.light==='sun'?'آفتاب':'تاریکی',faX(st.days),starch>.6?'آبی‌تیره':starch>0?'آبی کم‌رنگ':'قهوه‌ای','قهوه‌ای']);if(st.trials.length>=2&&st.trials.some(r=>r[2]==='قهوه‌ای')&&st.trials.some(r=>r[2]!=='قهوه‌ای'))st.done=true}else if(a==='reset'){Object.assign(st,{ph:'setup',t:0})}else if(a!=='reset')st.say='مرحله‌ها را به ترتیب انجام بده.'},
 tick(st,dt){st.t+=dt;const k=cl(st.t/1.5);const fx=60+st.foil*1.6;const leaf=(fill)=>`<path d="M60 130Q180 40 300 130Q180 220 60 130Z" fill="${fill}" stroke="#33691e" stroke-width="2"/><path d="M60 130H300" stroke="#33691e"/>`;
  if(st.ph==='setup')return `${st.light==='sun'?`<circle cx="320" cy="35" r="22" fill="#ffd54f"/>`:`<rect x="0" y="0" width="360" height="260" fill="#222" opacity=".55"/>`}${leaf('#7cb342')}${R(fx-22,80,44,100,'#bbb',`stroke="#888"`)}${T(180,245,`${st.light==='sun'?'گلدان در آفتاب':'گلدان در تاریکی'} · ${faX(st.days)} روز`,{b:1})}`;
  if(st.ph==='boil')return `${glassX(90,40,180,170)}${R(94,90,172,110,'#cfe8ff',`opacity=".7"`)}${Array.from({length:10},(_,i)=>`<circle cx="${110+i*15}" cy="${200-((performance.now()/6+i*23)%110)}" r="3" fill="#fff" stroke="#9cc"/>`).join('')}<g transform="translate(180,140) scale(.55) translate(-180,-130)">${leaf('#7cb342')}</g>${T(180,240,'آب جوش · ۱ دقیقه',{b:1})}`;
  if(st.ph==='alc'){const c=`hsl(90,${L(50,10,k)}%,${L(45,85,k)}%)`;return `${glassX(90,40,180,170)}${R(94,90,172,110,`hsl(90,${L(0,45,k)}%,${L(88,50,k)}%)`,`opacity=".8"`)}<g transform="translate(180,140) scale(.55) translate(-180,-130)">${leaf(c)}</g>${T(180,240,'الکل گرم: سبزینه خارج می‌شود',{b:1})}`}
  const s=st.starch;return `${leaf('#eee8c8')}<path d="M60 130Q180 40 300 130Q180 220 60 130Z" fill="#1a237e" opacity="${k*s*.9}"/>${R(fx-22,80,44,100,'#a1887f',`opacity="${k}"`)}${R(fx-22,80,44,100,'#eee8c8',`opacity="${k*.3}"`)}${k<.5?`<circle cx="180" cy="${L(20,90,k*2)}" r="4" fill="#5d4037"/>`:''}${T(180,245,'ید: آبی‌تیره = نشاسته · قهوه‌ای = بدون نشاسته',{b:1,s:11})}`},
 table:st=>tbl(['محل','روز','بخش نوردیده','زیر فویل'],st.trials),
 conclude:()=>'فقط بخش‌هایی از برگ که نور دیده‌اند با ید آبی‌تیره می‌شوند؛ پس گیاه برای ساختن نشاسته (غذا) به نور نیاز دارد. زیر فویل و در تاریکی نشاسته‌ای ساخته نمی‌شود.'},
/* 12 food web */
'12':{ctl:()=>`<p class="lab-p">روی هر جاندار در شکل بزن تا «حذف» شود (دوباره بزن تا برگردد). سپس زمان را جلو ببر.</p>`+`<div class="xp-row">${btn('run','۱۰ فصل بگذرد')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({pop:{grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5},dead:{},hist:[],season:0,removed:0}),
 say0:'شبکه در تعادل است. یک جاندار را حذف کن و ببین نخ‌های چه کسانی شل می‌شوند و جمعیت‌ها چه تغییری می‌کنند.',
 pointer(st,x,y,type){if(type!=='down')return;const P=this.P;for(const k in P){if(Math.hypot(P[k][0]-x,P[k][1]-y)<22){st.dead[k]=!st.dead[k];if(st.dead[k])st.removed++;st.say=st.dead[k]?`${this.N[k][1]} حذف شد. حالا «۱۰ فصل بگذرد» را بزن.`:`${this.N[k][1]} برگشت.`;return}}},
 P:{grass:[180,225],hopper:[80,170],mouse:[280,170],frog:[80,95],snake:[280,95],eagle:[180,30]},
 N:{grass:['🌿','علف'],hopper:['🦗','ملخ'],mouse:['🐭','موش'],frog:['🐸','قورباغه'],snake:['🐍','مار'],eagle:['🦅','عقاب']},
 E:[['grass','hopper'],['grass','mouse'],['hopper','frog'],['hopper','mouse'],['frog','snake'],['mouse','snake'],['mouse','eagle'],['snake','eagle'],['frog','eagle']],
 on(st,a){if(a==='run'){const base={grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5};for(let s=0;s<10;s++){const p=st.pop,n={};for(const k in p){if(st.dead[k]){n[k]=0;continue}const prey=this.E.filter(e=>e[1]===k).map(e=>e[0]),pred=this.E.filter(e=>e[0]===k).map(e=>e[1]);const food=prey.length?prey.reduce((a,q)=>a+p[q]/base[q],0)/prey.length:1;const hunt=pred.length?pred.reduce((a,q)=>a+p[q]/base[q],0)/pred.length:1;let g=1+0.25*(food-1)-0.25*(hunt-1)-0.08*(p[k]/base[k]-1);n[k]=Math.max(0,Math.min(base[k]*2.5,p[k]*g))}st.pop=n;st.season++}const chg=Object.keys(st.pop).filter(k=>!st.dead[k]).map(k=>[k,st.pop[k]/{grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5}[k]]);const up=chg.filter(c=>c[1]>1.2).map(c=>this.N[c[0]][1]),dn=chg.filter(c=>c[1]<.8).map(c=>this.N[c[0]][1]);st.say=st.removed?`پس از ${faX(st.season)} فصل: ${up.length?'زیاد شدند: '+up.join('، ')+'. ':''}${dn.length?'کم شدند: '+dn.join('، ')+'. ':''}${!up.length&&!dn.length?'تغییر چندانی نشد.':''}`:'بدون حذف، شبکه تقریباً پایدار ماند.';if(st.removed&&st.season>=10)st.done=true}
  if(a==='reset')Object.assign(st,this.init())},
 tick(st){const P=this.P,base={grass:100,hopper:60,mouse:40,frog:30,snake:12,eagle:5};return `${this.E.map(([a,b])=>{const slack=st.dead[a]||st.dead[b];return `<path d="M${P[a][0]} ${P[a][1]} Q${(P[a][0]+P[b][0])/2} ${(P[a][1]+P[b][1])/2+(slack?30:0)} ${P[b][0]} ${P[b][1]}" fill="none" stroke="${slack?'#bbb':'#d64d56'}" stroke-width="${slack?2:3}" stroke-dasharray="${slack?'4 4':'0'}"/>`}).join('')}${Object.keys(P).map(k=>{const r=st.dead[k]?0:cl(st.pop[k]/base[k]);return `<g transform="translate(${P[k][0]},${P[k][1]})" style="cursor:pointer" opacity="${st.dead[k]?.3:1}"><circle r="${14+r*8}" fill="${st.pop[k]/base[k]>1.2?'#ffe082':st.pop[k]/base[k]<.8?'#ffcdd2':'#c8e6c9'}" stroke="#666"/><text y="6" font-size="18" text-anchor="middle">${this.N[k][0]}</text>${T(0,32,`${this.N[k][1]} ${faX(Math.round(st.pop[k]))}`,{s:10})}${st.dead[k]?T(0,-18,'✖',{c:'#d64d56',b:1,s:16}):''}</g>`}).join('')}${T(320,250,`فصل ${faX(st.season)}`,{s:10,c:'var(--muted)'})}`},
 conclude:()=>'حذف یک جاندار فقط به خودش مربوط نیست: شکارچیانش گرسنه و کم می‌شوند، طعمه‌هایش زیاد می‌شوند و این تغییر در سراسر شبکه پخش می‌شود. شبکه‌ی غذایی با مسیرهای بیش‌تر، پایدارتر از یک زنجیره‌ی ساده است.'},
/* 13 germs */
'13':{ctl:()=>sl('shake','هر نفر با چند نفر دست می‌دهد',1,4,2)+segX('wash',[['none','بدون شستن'],['water','فقط آب'],['soap','آب و صابون ۲۰ ثانیه']],'none')+`<div class="xp-row">${btn('round','یک دور دست دادن')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({shake:2,wash:'none',inf:Array(24).fill(0).map((_,i)=>i===0?1:0),round:0,log:[],lines:[]}),
 say0:'نفر اول دست‌هایش «اکلیلی» است. تعداد دست دادن‌ها و روش شستن را انتخاب کن و دورها را جلو ببر.',
 on(st,a){if(a==='round'){const keep={none:1,water:.6,soap:.08}[st.wash];const n=st.inf.slice();st.lines=[];st.inf.forEach((v,i)=>{if(v<=0.1)return;for(let k=0;k<st.shake;k++){const j=Math.floor(Math.random()*24);if(j===i)continue;st.lines.push([i,j]);n[j]=Math.max(n[j],v*keep)}});st.inf=n.map(v=>v>0.1?v:0);st.round++;const c=st.inf.filter(v=>v>0).length;st.log.push([faX(st.round),faX(c)]);st.say=`دور ${faX(st.round)}: ${faX(c)} نفر از ۲۴ نفر «میکروب» دارند (${{none:'بدون شستن دست',water:'شستن فقط با آب',soap:'شستن با صابون'}[st.wash]}).`;if(st.round>=3&&(c>=12||st.wash==='soap'))st.done=true}
  if(a==='reset'){Object.assign(st,{inf:Array(24).fill(0).map((_,i)=>i===0?1:0),round:0,log:[],lines:[]})}},
 tick(st){const pos=i=>[40+(i%8)*40,50+Math.floor(i/8)*60];return `${st.lines.slice(0,60).map(([a,b])=>`<line x1="${pos(a)[0]}" y1="${pos(a)[1]}" x2="${pos(b)[0]}" y2="${pos(b)[1]}" stroke="#ddd"/>`).join('')}${st.inf.map((v,i)=>{const [x,y]=pos(i);return `<g transform="translate(${x},${y})"><circle r="15" fill="${v>0?'#ffe0b2':'#e0f2f1'}" stroke="#999"/><text y="5" font-size="14" text-anchor="middle">${v>0?'🤢':'🙂'}</text>${v>0?Array.from({length:Math.round(v*6)},(_,k)=>`<circle cx="${-9+(k*5)%18}" cy="${8+(k*3)%8}" r="1.6" fill="#e91e63"/>`).join(''):''}</g>`}).join('')}${T(180,245,`آلوده: ${faX(st.inf.filter(v=>v>0).length)} از ۲۴ · دور ${faX(st.round)}`,{b:1})}`},
 table:st=>tbl(['دور','افراد آلوده'],st.log),
 conclude:()=>'«میکروب‌ها» با دست دادن خیلی سریع به افراد زیادی می‌رسند. شستن با آب تنها کمی کمک می‌کند، اما شستن با آب و صابون به مدت ۲۰ ثانیه زنجیره‌ی انتقال را تقریباً قطع می‌کند.'},
/* 14 lamps */
'14':{ctl:()=>segX('lamp',[['inc','رشته‌ای ۶۰ وات'],['cfl','کم‌مصرف ۱۴ وات'],['led','LED ۷ وات']],'inc')+`<div class="xp-row">${btn('on','روشن / خاموش')}${btn('fast','۱ ساعت جلو')}${btn('rec','ثبت این لامپ')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({lamp:'inc',on:false,temp:25,Wh:0,min:0,log:[]}),
 say0:'یک لامپ را انتخاب و روشن کن. دماسنج و شمارنده‌ی مصرف را تماشا کن؛ سپس لامپ‌های دیگر را امتحان و ثبت کن.',

SIM.react={ctl:()=>segX('cue',[['see','چشم (نور)'],['hear','گوش (صدا)'],['touch','پوست (لمس)']],'see')+`<div class="xp-row">${btn('go','آماده… منتظر علامت باش!')}${btn('reset','از اول','ghost')}</div>`,
 init:()=>({cue:'see',phase:'idle',t:0,wait:0,log:[]}),say0:()=>'وقتی علامت را دیدی/شنیدی، سریع روی صفحه بزن. پیام از اندام حسی به مغز و از مغز به ماهیچه می‌رود؛ چقدر طول می‌کشد؟',
 on(st,a){if(a==='go'){st.phase='wait';st.t=0;st.wait=1+Math.random()*2.5;st.say='منتظر بمان…'}if(a==='reset'){st.log=[];st.phase='idle'}},
 pointer(st,x,y,type){if(type!=='down')return;if(st.phase==='go'){const ms=Math.round(st.t*1000);st.log.push([{see:'چشم',hear:'گوش',touch:'پوست'}[st.cue],faX(ms)+' هزارم ثانیه']);st.phase='idle';st.say=`زمان واکنش تو: ${faX(ms)} هزارم ثانیه. مسیر پیام: اندام حسی ← عصب ← مغز ← عصب ← ماهیچه‌ی دست.`;if(st.log.length>=3&&new Set(st.log.map(r=>r[0])).size>=2)st.done=true}else if(st.phase==='wait'){st.phase='idle';st.say='زود زدی! باید صبر کنی تا علامت بیاید.'}},
 tick(st,dt){if(st.phase==='wait'){st.t+=dt;if(st.t>=st.wait){st.phase='go';st.t=0;if(st.cue==='hear')try{tone([[880,.15]])}catch(e){}}}else if(st.phase==='go')st.t+=dt;const go=st.phase==='go';
  return `${R(0,0,360,260,go&&st.cue==='see'?'#c8e6c9':'#fafafa')}<text x="180" y="120" font-size="60" text-anchor="middle">${st.phase==='wait'?'⏳':go?({see:'🟢',hear:'🔔',touch:'👋'}[st.cue]):'🧠'}</text>${T(180,190,st.phase==='wait'?'صبر کن…':go?'حالا بزن!':'دکمه‌ی «آماده» را بزن',{b:1,s:14})}<path d="M40 230 h60 l20 -10 h60 l20 10 h60 l20 -10 h50" fill="none" stroke="var(--line)" stroke-width="2"/>${['👁️','🧠','💪'].map((e,i)=>`<text x="${60+i*120}" y="252" font-size="16" text-anchor="middle">${e}</text>`).join('')}`},
 table:st=>tbl(['اندام حسی','زمان واکنش'],st.log),conclude:p=>p.conclude||'اندام‌های حسی پیام را می‌گیرند، عصب‌ها آن را به مغز می‌برند، مغز تصمیم می‌گیرد و به ماهیچه فرمان می‌دهد؛ این مسیر کسری از ثانیه طول می‌کشد.'};
/* ---- factory ---- */
function makeSim(tpl,p){const b=SIM[tpl];if(!b)throw new Error('no sim '+tpl);const x={};for(const k in b){const v=b[k];if(typeof v==='function'){if(k==='say0'){x.say0=v.call(x,p);continue}x[k]=function(...args){if(k==='init'||k==='conclude'||k==='ctl')return v.call(x,p);if(k==='table')return v.call(x,args[0]);if(k==='pointer'||k==='seg')return v.call(x,...args);return v.call(x,args[0],args[1],args[2],p)}}else x[k]=v}x.p=p;x.tpl=tpl;return x}
window.SIM=SIM;window.makeSim=makeSim;

function lessonLabs(l){const ls=labs.filter(x=>x.lesson===l.id),lb=labels.filter(x=>x.lesson===l.id);if(!ls.length&&!lb.length)return'';return `${ls.map(x=>`<details class="embed" open><summary>🎛️ ${x.title}</summary>${renderLabBody(x.id)}</details>`).join('')}${lb.map(x=>`<details class="embed" open><summary>🏷️ ${x.title}</summary>${renderLabelBody(x.id)}</details>`).join('')}`}
function quizCard(q,qid,i){const a=state.quiz[qid];return `<article class="quiz-card" data-qid="${qid}"><div class="q-top"><span>پرسش ${fa(i+1)} · ${diffLabel(q.d)}</span>${speakBtn('.quiz-card')}</div><h3>${q.q}</h3><div class="options">${q.o.map((o,j)=>{let c='';if(a)c=j===q.a?'correct':j===a.choice?'wrong':'';return `<button class="option ${c}" data-action="quiz" data-qid="${qid}" data-choice="${j}" ${a?'disabled':''}><span>${['الف','ب','پ','ت'][j]}</span>${o}</button>`}).join('')}</div>${a?`<div class="feedback ${a.ok?'good':'bad'}"><b>${a.ok?'آفرین! درست است.':'پاسخ درست: '+q.o[q.a]}</b><p>${q.e}</p></div>`:''}</article>`}

 avg3:()=>{const a=ri(10,30),b=a+ri(-3,3),c=a+ri(-3,3),s=a+b+c;return{rows:[`سه بار طول یک مداد را اندازه گرفتیم: ${fa(a)}، ${fa(b)} و ${fa(c)} سانتی‌متر.`,`مجموع: ${B(s,1,'سه عدد را جمع کن.')}`,`میانگین: ${fa(s)} ÷ ۳ = ${B(Math.round(s/3*100)/100,2,'مجموع را بر ۳ تقسیم کن.',5)}`]}},
 trees:()=>{const t=ri(2,9);return{rows:[`بازیافت هر تُن کاغذ ۱۷ درخت را نجات می‌دهد. مدرسه ${fa(t)} تُن کاغذ بازیافت کرد.`,`درخت‌های نجات‌یافته: ${fa(t)} × ۱۷ = ${B(t*17,1,'۱۷ را در تعداد تُن ضرب کن.',3)}`,`اگر دو برابر بازیافت کنند: ${B(2*t*17,2,'حاصل قبلی را دو برابر کن.',3)}`]}},
 solution:()=>{const w=ri(100,400),s=ri(5,40);return{rows:[`${fa(s)} گرم نمک را در ${fa(w)} گرم آب حل کردیم.`,`جرم محلول: ${fa(w)} + ${fa(s)} = ${B(w+s,1,'جرم حلال و حل‌شونده جمع می‌شود؛ چیزی از بین نمی‌رود.',3)} گرم`,`اگر همه‌ی آب تبخیر شود چند گرم می‌ماند؟ ${B(s,2,'فقط نمک می‌ماند.',2)}`]}},
 depth:()=>{const d=ri(2,9);return{rows:[`در پوسته با هر کیلومتر عمق، دما حدود ۳۰ درجه زیاد می‌شود. دمای سطح ۲۰ درجه است.`,`افزایش دما در ${fa(d)} کیلومتر: ${fa(d)} × ۳۰ = ${B(d*30,1,'۳۰ را در عمق ضرب کن.',3)}`,`دمای آن عمق: ۲۰ + ${fa(d*30)} = ${B(20+d*30,2,'به دمای سطح اضافه کن.',3)} درجه`]}},
 quake:()=>{const y=ri(10,50),v=ri(2,6);return{rows:[`ورقه‌ای سالی ${fa(v)} سانتی‌متر حرکت می‌کند.`,`در ${fa(y)} سال: ${fa(y)} × ${fa(v)} = ${B(y*v,1,'سال × سرعت.',3)} سانتی‌متر = ${B(y*v/100,2,'بر ۱۰۰ تقسیم کن.',4)} متر`,`هر واحد ریشتر ۳۲ برابر انرژی دارد؛ زلزله‌ی ۶ نسبت به ۵: ${B(32,3,'یک واحد اختلاف.',2)} برابر`]}},
 weight:()=>{const m=ri(2,45);return{rows:[`جرم کوله‌پشتی ${fa(m)} کیلوگرم است.`,`وزن روی زمین ≈ جرم × ۱۰ = ${B(m*10,1,'یک صفر جلوی جرم بگذار.',3)} نیوتن`,`وزن روی ماه (یک‌ششم): ${fa(m*10)} ÷ ۶ ≈ ${B(Math.round(m*10/6*10)/10,2,'بر ۶ تقسیم کن (با یک رقم اعشار).',5)} نیوتن`,`جرم روی ماه: ${B(m,3,'جرم تغییر نمی‌کند.',2)} کیلوگرم`]}},
 net:()=>{let a=ri(30,60)*10,b=ri(30,60)*10;if(a===b)b+=20;return{rows:[`گروه الف با ${fa(a)} و گروه ب با ${fa(b)} نیوتن طناب را می‌کشند.`,`نیروی خالص: ${fa(Math.max(a,b))} − ${fa(Math.min(a,b))} = ${B(Math.abs(a-b),1,'بزرگ منهای کوچک.',3)} نیوتن`,`به سمت گروه … (الف = ۱، ب = ۲): ${B(a>b?1:2,2,'گروهی که نیروی بیش‌تری دارد.',1)}`]}},
 friction:()=>{const s=ri(2,5),k=ri(2,4);return{rows:[`کشیدن جعبه روی میز صاف ${fa(s)} نیوتن نیرو می‌خواهد و روی فرش ${fa(k)} برابر آن.`,`روی فرش: ${fa(s)} × ${fa(k)} = ${B(s*k,1,'ضرب کن.',2)} نیوتن`,`اگر وزن جعبه دو برابر شود، روی فرش تقریباً: ${B(2*s*k,2,'اصطکاک هم دو برابر می‌شود.',2)} نیوتن`]}},
 car:()=>{const p=ri(2,6),d=ri(20,40);return{rows:[`ماشین کِشی با هر پیچش کِش حدود ${fa(d)} سانتی‌متر می‌رود.`,`با ${fa(p)} پیچش: ${fa(p)} × ${fa(d)} = ${B(p*d,1,'ضرب کن.',3)} سانتی‌متر = ${B(p*d/100,2,'بر ۱۰۰ تقسیم کن.',4)} متر`,`روی فرش نصف مسافت: ${B(p*d/2,3,'حاصل اول را نصف کن.',3)} سانتی‌متر`]}},
 energy:()=>{const h=ri(3,8),n=ri(2,6);return{rows:[`لامپ رشته‌ای ۶۰ وات و LED هم‌نور آن ۶ وات است؛ ${fa(n)} لامپ روزی ${fa(h)} ساعت روشن‌اند.`,`مصرف روزانه‌ی رشته‌ای: ۶۰ × ${fa(h)} × ${fa(n)} = ${B(60*h*n,1,'توان × ساعت × تعداد.',4)} وات‌ساعت`,`مصرف LED: ۶ × ${fa(h)} × ${fa(n)} = ${B(6*h*n,2,'یک‌دهم قبلی.',3)} وات‌ساعت`,`صرفه‌جویی روزانه: ${B(54*h*n,3,'تفاضل دو عدد.',4)} وات‌ساعت`]}},
 microscope:()=>{const e=pick([5,10,15]),o=pick([4,10,40]);return{rows:[`عدسی چشمی ${fa(e)}× و عدسی شیئی ${fa(o)}× است.`,`بزرگ‌نمایی کل: ${fa(e)} × ${fa(o)} = ${B(e*o,1,'دو عدد را ضرب کن.',3)} برابر`,`سلولی به اندازه‌ی ۰٫۰۵ میلی‌متر با این بزرگ‌نمایی چند میلی‌متر دیده می‌شود؟ ${B(Math.round(e*o*0.05*100)/100,2,'اندازه × بزرگ‌نمایی.',5)}`]}},
 leaf:()=>{const n=ri(4,9),a=ri(5,12);return{rows:[`هر برگ روزانه ${fa(a)} میلی‌لیتر آب تعرق می‌کند. گیاه ${fa(n)} برگ دارد.`,`تعرق روزانه‌ی گیاه: ${fa(n)} × ${fa(a)} = ${B(n*a,1,'ضرب کن.',3)} میلی‌لیتر`,`در یک هفته: ${B(7*n*a,2,'در ۷ ضرب کن.',4)} میلی‌لیتر`]}},
 population:()=>{const r=ri(40,90)*10,k=ri(4,8);return{rows:[`در جنگلی ${fa(r)} خرگوش و ${fa(Math.round(r/k))} روباه زندگی می‌کنند.`,`به ازای هر روباه چند خرگوش؟ ${fa(r)} ÷ ${fa(Math.round(r/k))} ≈ ${B(Math.round(r/Math.round(r/k)),1,'تقسیم کن و گرد کن.',2)}`,`اگر نیمی از روباه‌ها شکار شوند، چند روباه می‌ماند؟ ${B(Math.round(Math.round(r/k)/2),2,'نصف کن.',2)}؛ جمعیت خرگوش‌ها زیاد می‌شود یا کم؟ (زیاد = ۱، کم = ۲) ${B(1,3,'شکارچی کم‌تر شده است.',1)}`]}},
 spread:()=>{const k=ri(2,3),d=ri(3,4);return{rows:[`هر بیمار روزانه ${fa(k)} نفر را مبتلا می‌کند.`,`روز اول ۱ نفر؛ روز دوم: ${B(k,1,'۱ × '+fa(k)+'.',2)}؛ روز سوم: ${B(k*k,2,'باز در '+fa(k)+' ضرب کن.',2)}؛ روز چهارم: ${B(k*k*k,3,'باز در '+fa(k)+' ضرب کن.',3)}`,`اگر با شستن دست‌ها هر نفر فقط ۱ نفر را مبتلا کند، روز چهارم: ${B(1,4,'هر روز همان یک نفر.',1)}`]}},
 lamp:()=>{const w=pick([40,60,100]),h=ri(3,9);return{rows:[`لامپ ${fa(w)} واتی ${fa(h)} ساعت روشن است.`,`مصرف: ${fa(w)} × ${fa(h)} = ${B(w*h,1,'وات × ساعت.',4)} وات‌ساعت`,`LED هم‌نور با یک‌دهم توان: ${B(w*h/10,2,'حاصل قبلی ÷ ۱۰.',3)} وات‌ساعت`]}}
};
Object.assign(NUMGEN,window.NUMGEN_EXTRA?window.NUMGEN_EXTRA(ri,fa,B,pick):{});
function B(ans,step,hint,w=3){return `<input class="fx-blank" data-fx-blank data-kind="num" data-answer="${ans}" data-step="${step}" data-hint="${esc(hint)}" inputmode="decimal" autocomplete="off" style="width:${w+1.4}ch" aria-label="جای خالی مرحله‌ی ${fa(step)}">`}
function fxBody(f){
 if(f.type==='num'){const g=NUMGEN[f.gen]();return g.rows.map(r=>`<div class="fx-row">${r}</div>`).join('')}
 if(f.type==='word'){let step=0;const rows=f.rows.map(([tpl,hint])=>`<div class="fx-row">${tpl.replace(/\{([^}]+)\}/g,(m,ans)=>{step++;return `<select class="fx-blank fx-select" data-fx-blank data-kind="word" data-answer="${esc(ans)}" data-step="${step}" data-hint="${esc(hint)}"><option value="">▢</option>${shuffle(f.bank).map(w=>`<option value="${esc(w)}">${w}</option>`).join('')}</select>`})}</div>`);return rows.join('')}
 const items=shuffle(f.items.map((t,i)=>({t,i})));return `<div class="fx-row">ترتیب درست را با شماره مشخص کن (۱ = اولین):</div><div class="fx-order">${items.map(x=>`<div class="fx-order-item"><input class="fx-blank" data-fx-blank data-kind="num" data-answer="${x.i+1}" data-step="${x.i+1}" data-hint="${esc(f.hint)}" inputmode="numeric" style="width:2.6ch"><span>${x.t}</span></div>`).join('')}</div>`}
function fxCard(lid,i){const f=lessonMap.get(lid).fx[i];const done=state.fx[`${lid}-${i}`];return `<article class="fx-card ${done?'was-done':''}" data-fx="${lid}-${i}"><header><span class="fx-badge">${f.type==='order'?'ترتیب مراحل':f.type==='word'?'جای خالی کلمه‌ای':'جای خالی عددی'}</span><h3>${f.t}</h3><div class="fx-tools"><button type="button" class="fx-btn" data-action="fx-new">مثال تازه</button><button type="button" class="fx-btn" data-action="fx-hint">راهنما</button><button type="button" class="fx-btn ghost" data-action="fx-solve">راه‌حل</button></div></header><div class="fx-body">${fxBody(f)}</div><div class="fx-fb" data-fx-fb><b>${done?'قبلاً کامل کرده‌ای؛ دوباره امتحان کن.':'از مرحله‌ی ۱ شروع کن.'}</b></div></article>`}
const fxBlanks=box=>[...box.querySelectorAll('[data-fx-blank]')].sort((a,b)=>Number(a.dataset.step)-Number(b.dataset.step));
const fxOk=b=>{const v=b.value.trim();if(!v)return false;if(b.dataset.kind==='word')return v===b.dataset.answer;const n=num(v);return !isNaN(n)&&Math.abs(n-Number(b.dataset.answer))<1e-6};
function fxFb(box,cls,html){const f=box.querySelector('[data-fx-fb]');f.className='fx-fb '+cls;f.innerHTML=html}
function fxCheck(box,changed){const bs=fxBlanks(box);bs.forEach(b=>{if(!b.value.trim()){b.classList.remove('ok','bad');return}const ok=fxOk(b);b.classList.toggle('ok',ok);b.classList.toggle('bad',!ok)});if(!changed.value.trim())return;const step=fa(changed.dataset.step);
 if(!fxOk(changed)){buzz();changed.classList.add('shake');setTimeout(()=>changed.classList.remove('shake'),450);fxFb(box,'bad',`<b>مرحله‌ی ${step} هنوز درست نیست.</b><span>راهنما: ${changed.dataset.hint}</span>`);return}
 if(bs.every(fxOk)){cheer();box.classList.add('done');setTimeout(()=>box.classList.remove('done'),1600);state.fx[box.dataset.fx]=true;save();fxFb(box,'cheer','<b>آفرین! همه‌ی مرحله‌ها درست است. 🎉</b><span>«مثال تازه» را بزن و دوباره امتحان کن.</span>');return}
 ding();const nxt=bs.find(b=>!fxOk(b));fxFb(box,'good',`<b>درست است! مرحله‌ی ${step} کامل شد. 👏</b><span>${nxt?'مرحله‌ی '+fa(nxt.dataset.step)+': '+nxt.dataset.hint:''}</span>`);if(nxt&&!nxt.value)nxt.focus()}
function fxHint(box){const n=fxBlanks(box).find(b=>!fxOk(b));if(!n){fxFb(box,'cheer','<b>همه‌ی مرحله‌ها درست است.</b>');return}fxFb(box,'hint',`<b>راهنمای مرحله‌ی ${fa(n.dataset.step)}</b><span>${n.dataset.hint}</span>`);n.focus()}
function fxSolve(box){fxBlanks(box).forEach(b=>{b.value=b.dataset.kind==='word'?b.dataset.answer:fa(b.dataset.answer);b.classList.add('ok');b.classList.remove('bad')});fxFb(box,'hint','<b>راه‌حل کامل نمایش داده شد.</b><span>حالا با «مثال تازه» خودت حل کن.</span>')}
function fxNew(box){const [lid,i]=box.dataset.fx.split('-');box.querySelector('.fx-body').innerHTML=fxBody(lessonMap.get(lid).fx[Number(i)]);fxFb(box,'','<b>مثال تازه آماده است؛ از مرحله‌ی ۱ شروع کن.</b>');localize(box.querySelector('.fx-body'))}
function renderFill(uid){const cur=uid&&unitMap.get(String(uid))?String(uid):String(units[0].id),ls=lessons.filter(l=>String(l.unit)===cur);return `${heading('تمرین‌های گام‌به‌گام با جای خالی','کلمه، عدد یا ترتیب مراحل؛ هر مرحله راهنمای خودش را دارد و پاسخ درست صدای تشویق می‌آورد.','کارگاه حل مرحله‌ای')}<div class="fx-tabs">${units.map(u=>`<button class="fx-tab ${String(u.id)===cur?'active':''}" data-route="fill/${u.id}" style="--u:${u.color}">${u.icon} ${u.title}</button>`).join('')}</div>${ls.map(l=>`<h2 class="sub">درس ${fa(l.id)}: ${l.title}</h2><div class="fx-grid">${l.fx.map((f,i)=>fxCard(l.id,i)).join('')}</div>`).join('')}`}
/* ---------- LABS (simulations) ---------- */
function labCard(x){return `<button class="lab-card" data-route="lab/${x.id}"><span>${x.icon}</span><h3>${x.title}</h3><p>${x.desc}</p></button>`}
function renderLabs(){return `${heading('آزمایشگاه مجازی و برچسب‌گذاری',`${fa(labs.length)} شبیه‌ساز با کنترل‌های لغزنده و ${fa(labels.length)} فعالیت برچسب‌گذاری و دسته‌بندی.`,'یادگیری با دست‌ورزی')}<div class="lab-grid">${labs.map(labCard).join('')}</div><h2 class="sub">برچسب‌گذاری و دسته‌بندی تصویری</h2><div class="lab-grid">${labels.map(x=>`<button class="lab-card" data-route="label/${x.id}"><span>🏷️</span><h3>${x.title}</h3><p>${x.targets?'نام هر بخش را روی شکل بگذار.':'هر کارت را در دسته‌ی درست بینداز.'}${state.labelsDone[x.id]?' ✓':''}</p></button>`).join('')}</div>`}
function renderLab(id){const x=labs.find(l=>l.id===id);if(!x)return r404();return `${crumb([{label:'آزمایشگاه',route:'labs'},{label:x.title}])}${heading(x.title,x.desc,'شبیه‌ساز')}${renderLabBody(id)}<div class="hero-actions"><button class="button button-secondary" data-route="lesson/${x.lesson}">بازگشت به درس ${fa(x.lesson)}</button></div>`}
const slider=(name,label,min,max,val,step=1,unit='')=>`<label class="sl"><span>${label}: <b data-out="${name}">${fa(val)}</b> ${unit}</span><input type="range" name="${name}" min="${min}" max="${max}" value="${val}" step="${step}" data-lab-input></label>`;
const seg=(name,opts,val)=>`<div class="seg" data-seg="${name}">${opts.map(o=>`<button type="button" class="${o[0]===val?'active':''}" data-lab-seg="${name}" data-value="${o[0]}">${o[1]}</button>`).join('')}</div>`;
function renderLabBody(id){if(!LAB[id])return renderXP('lab:'+id);return `<section class="lab" data-lab="${id}"><div class="lab-controls">${LAB[id].controls()}</div><div class="lab-stage" data-lab-stage></div><div class="lab-note" data-lab-note></div></section>`}
const LAB={
 float:{controls:()=>seg('obj',[['egg','تخم‌مرغ'],['wood','چوب'],['stone','سنگ'],['ice','یخ'],['oil','قطره‌ی روغن']],'egg')+slider('salt','نمک حل‌شده',0,10,0,1,'قاشق'),

 const fb=lab.querySelector('[data-fx-fb]');if(ok){const left=lab.querySelectorAll('.label-bank .tag').length;if(left===0){cheer();fb.className='fx-fb cheer';fb.innerHTML='<b>آفرین! همه‌ی برچسب‌ها درست جای گرفتند. 🎉</b>';state.labelsDone[lab.dataset.labeler]=true;save()}else{ding();fb.className='fx-fb good';fb.innerHTML=`<b>درست است! 👏</b><span>${fa(left)} برچسب دیگر مانده.</span>`}}else{buzz();tag.classList.add('shake');setTimeout(()=>tag.classList.remove('shake'),450);fb.className='fx-fb bad';fb.innerHTML=`<b>«${tag.dataset.tag}» این‌جا نیست.</b><span>${kind==='spots'?'به جای این بخش روی شکل دقت کن.':'دوباره فکر کن این مورد به کدام دسته تعلق دارد.'}</span>`}}
/* ---------- PRACTICE ---------- */
let practiceRun=null;
function renderPractice(){if(!practiceRun)return `${heading('تمرین‌های چندشیوه‌ای','بخش، سطح و شیوه‌ی پاسخ را انتخاب کن؛ چهارگزینه‌ای، درست/نادرست یا پاسخ کوتاه.','کارگاه تمرین')}<section class="fx-entry"><div><span class="eyebrow">گام‌به‌گام</span><h2>تمرین‌های جای خالی با صدای تشویق</h2><p>${fa(lessons.reduce((s,l)=>s+l.fx.length,0))} تمرین کلمه‌ای، عددی و ترتیبی برای موضوع‌های مهم هر درس.</p></div><button class="button button-primary" data-route="fill">شروع</button></section><form id="practiceForm" class="setup"><label>بخش<select name="unit"><option value="all">همه‌ی بخش‌ها</option>${units.map(u=>`<option value="${u.id}">${u.title}</option>`).join('')}</select></label><label>سطح<select name="d"><option value="all">همه</option><option value="easy">ساده</option><option value="medium">متوسط</option><option value="hard">چالشی</option></select></label><label>شیوه<select name="mode"><option value="choice">چهارگزینه‌ای</option><option value="tf">درست / نادرست</option><option value="input">پاسخ کوتاه (تایپ)</option></select></label><label>تعداد<select name="n"><option>۵</option><option selected>۱۰</option><option>۱۵</option></select></label><button class="button button-primary">شروع تمرین</button></form><div class="stats3"><div><strong>${fa(QALL.length)}</strong><small>پرسش در بانک</small></div><div><strong>${fa(state.practice.length)}</strong><small>تمرین انجام‌شده</small></div><div><strong>${fa(state.mistakes.length)}</strong><small>در دفتر اشتباه‌ها</small></div></div>`;
 if(practiceRun.done)return practiceResult();const q=practiceRun.items[practiceRun.i],sel=practiceRun.ans[practiceRun.i];return `<section class="runner"><div class="runner-top"><span>${q.lesson.title} · ${diffLabel(q.d)}</span><span>${fa(practiceRun.i+1)} از ${fa(practiceRun.items.length)}</span><button class="button button-ghost" data-action="p-exit">خروج</button></div><div class="bar"><i style="width:${pct(practiceRun.i,practiceRun.items.length)}%"></i></div><h2>${q.q} ${speakBtn('.runner')}</h2>${practiceResp(q,sel)}${sel?.checked?`<div class="feedback ${sel.ok?'good':'bad'}"><b>${sel.ok?'آفرین!':'پاسخ درست: '+q.o[q.a]}</b><p>${q.e}</p></div><button class="button button-primary" data-action="p-next">${practiceRun.i+1<practiceRun.items.length?'پرسش بعدی':'پایان و کارنامه'}</button>`:`<div class="hero-actions"><button class="button button-primary" data-action="p-check">بررسی پاسخ</button><button class="button button-ghost" data-action="p-hint">راهنما</button></div><div class="hintbox" hidden>💡 ${q.e.split('؛')[0].split('.')[0]}.</div>`}</section>`}
function practiceResp(q,sel){const m=practiceRun.mode;if(m==='choice')return `<div class="options">${q.o.map((o,j)=>{let c='';if(sel?.checked)c=j===q.a?'correct':j===sel.choice?'wrong':'';else if(sel?.choice===j)c='selected';return `<button class="option ${c}" data-action="p-choice" data-choice="${j}" ${sel?.checked?'disabled':''}><span>${['الف','ب','پ','ت'][j]}</span>${o}</button>`}).join('')}</div>`;if(m==='tf')return `<p class="tf-stmt">گزاره: «پاسخ این پرسش <b>${q.o[q.tfIdx]}</b> است.»</p><div class="options tf">${['درست','نادرست'].map((o,j)=>`<button class="option ${sel?.checked?(j===q.tfAns?'correct':j===sel.choice?'wrong':''):sel?.choice===j?'selected':''}" data-action="p-choice" data-choice="${j}" ${sel?.checked?'disabled':''}>${o}</button>`).join('')}</div>`;return `<label class="short"><span>پاسخ را بنویس (یک یا دو کلمه‌ی کلیدی کافی است).</span><input type="text" data-p-input value="${esc(sel?.text||'')}" ${sel?.checked?'disabled':''}></label>`}
function startPractice(fd){let pool=QALL.filter(q=>(fd.unit==='all'||String(q.lesson.unit)===fd.unit)&&(fd.d==='all'||q.d===fd.d));pool=shuffle(pool).slice(0,num(fd.n)).map(q=>{const tfIdx=Math.random()<.5?q.a:pick(q.o.map((_,i)=>i).filter(i=>i!==q.a));return{...q,tfIdx,tfAns:tfIdx===q.a?0:1}});practiceRun={items:pool,i:0,ans:{},mode:fd.mode,done:false,start:Date.now()};render()}
function normalize(s){return String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s‌]+/g,'').toLowerCase()}
function checkPractice(){const q=practiceRun.items[practiceRun.i],a=practiceRun.ans[practiceRun.i]||{};let ok;if(practiceRun.mode==='input'){const t=view.querySelector('[data-p-input]')?.value||'';a.text=t;const ans=normalize(q.o[q.a]);ok=normalize(t).length>=2&&(ans.includes(normalize(t))||normalize(t).includes(ans))}else{if(a.choice==null){toast('اول یک گزینه انتخاب کن.');return}ok=practiceRun.mode==='tf'?a.choice===q.tfAns:a.choice===q.a}a.checked=true;a.ok=ok;practiceRun.ans[practiceRun.i]=a;ok?ding():buzz();if(!ok)addMistake(q);if(practiceRun.review){const m=state.mistakes.find(x=>x.id===q.id);if(m){EXTF.scheduleMistake(m,ok);state.reviews=(state.reviews||0)+1;if(ok&&(m.hits||0)>=2)state.mistakes=state.mistakes.filter(x=>x!==m);save();EXTF.checkBadges()}}render()}
function addMistake(q){if(!state.mistakes.find(m=>m.id===q.id))state.mistakes.push({id:q.id,at:Date.now(),count:1,stage:0,due:Date.now()+86400000});else state.mistakes.find(m=>m.id===q.id).count++;save()}
function practiceResult(){const n=practiceRun.items.length,c=Object.values(practiceRun.ans).filter(a=>a.ok).length;return `${heading('کارنامه‌ی تمرین',`${fa(c)} پاسخ درست از ${fa(n)}`,'نتیجه')}<div class="ring" style="--p:${pct(c,n)}"><strong>${fa(pct(c,n))}٪</strong></div><div class="review">${practiceRun.items.map((q,i)=>`<article class="${practiceRun.ans[i]?.ok?'ok':'bad'}"><b>${fa(i+1)}. ${q.q}</b><p>پاسخ درست: ${q.o[q.a]} — ${q.e}</p><button class="button button-ghost" data-route="lesson/${q.lesson.id}">مرور درس</button></article>`).join('')}</div><div class="hero-actions"><button class="button button-primary" data-action="p-exit">تمرین تازه</button><button class="button button-secondary" data-route="mistakes">دفتر اشتباه‌ها</button></div>`}
/* ---------- EXAMS ---------- */
let examRun=null;
function renderExams(uid){if(examRun)return examRun.done?examResult():examQ();return `${heading('آزمون‌های کامل','آزمون هر بخش یا آزمون جامع؛ بدون راهنما و با کارنامه‌ی مهارتی.','سنجش')}<form id="examForm" class="setup"><label>محدوده<select name="unit">${uid?'':'<option value="all">جامع (همه‌ی بخش‌ها)</option>'}${units.map(u=>`<option value="${u.id}" ${String(u.id)===String(uid)?'selected':''}>${u.title}</option>`).join('')}${uid?'<option value="all">جامع</option>':''}</select></label><label>تعداد<select name="n"><option>۱۰</option><option selected>۱۵</option><option>۲۰</option></select></label><button class="button button-primary">شروع آزمون</button></form>${state.exams.length?`<h2 class="sub">آزمون‌های قبلی</h2><div class="review">${state.exams.slice(-6).reverse().map(e=>`<article><b>${e.title}</b><p>${fa(e.c)} از ${fa(e.n)} · ${fa(e.p)}٪ · ${new Date(e.at).toLocaleDateString('fa-IR')}</p></article>`).join('')}</div>`:''}`}
function examQ(){const q=examRun.items[examRun.i],a=examRun.ans[examRun.i];return `<section class="runner"><div class="runner-top"><span>${examRun.title}</span><span>${fa(examRun.i+1)} از ${fa(examRun.items.length)}</span></div><div class="bar"><i style="width:${pct(examRun.i,examRun.items.length)}%"></i></div><h2>${q.q}</h2><div class="options">${q.o.map((o,j)=>`<button class="option ${a===j?'selected':''}" data-action="e-choice" data-choice="${j}"><span>${['الف','ب','پ','ت'][j]}</span>${o}</button>`).join('')}</div><div class="hero-actions"><button class="button button-primary" data-action="e-next">${examRun.i+1<examRun.items.length?'بعدی':'پایان آزمون'}</button></div></section>`}
function examResult(){const n=examRun.items.length,c=examRun.items.filter((q,i)=>examRun.ans[i]===q.a).length;const byU={};examRun.items.forEach((q,i)=>{const u=q.lesson.unitObj.title;byU[u]=byU[u]||[0,0];byU[u][1]++;if(examRun.ans[i]===q.a)byU[u][0]++});return `${heading('کارنامه‌ی آزمون',`${examRun.title} · ${fa(c)} از ${fa(n)}`,'نتیجه')}<div class="ring" style="--p:${pct(c,n)}"><strong>${fa(pct(c,n))}٪</strong></div><h2 class="sub">به تفکیک بخش</h2><div class="skill-list">${Object.entries(byU).map(([u,v])=>`<div><span>${u}</span><div class="bar"><i style="width:${pct(v[0],v[1])}%"></i></div><small>${fa(v[0])}/${fa(v[1])}</small></div>`).join('')}</div><div class="review">${examRun.items.map((q,i)=>`<article class="${examRun.ans[i]===q.a?'ok':'bad'}"><b>${fa(i+1)}. ${q.q}</b><p>پاسخ درست: ${q.o[q.a]} — ${q.e}</p></article>`).join('')}</div><div class="hero-actions"><button class="button button-primary" data-action="e-exit">آزمون تازه</button><button class="button button-secondary" data-action="print">چاپ کارنامه</button></div>`}
/* ---------- MISTAKES / SPACED ---------- */
function renderMistakes(){const ms=state.mistakes.map(m=>({...m,q:QALL.find(q=>q.id===m.id)})).filter(m=>m.q);return `${heading('دفتر اشتباه‌ها و مرور فاصله‌دار','پرسش‌هایی که اشتباه پاسخ داده‌ای؛ پس از دو پاسخ درست از دفتر خارج می‌شوند.','یادگیری از خطا')}${ms.length?`${EXTF.reviewCard()}<div class="hero-actions"><button class="button button-primary" data-action="review-start">مرور ${fa(Math.min(10,ms.length))} پرسش</button></div><div class="review">${ms.map(m=>`<article><b>${m.q.q}</b><p>${m.q.lesson.title} · ${fa(m.count)} بار اشتباه · مرحله‌ی ${fa((m.stage||0)+1)} · موعد: ${m.due?new Date(m.due).toLocaleDateString('fa-IR'):'امروز'}</p><button class="button button-ghost" data-route="lesson/${m.q.lesson.id}">مرور درس</button></article>`).join('')}</div>`:'<div class="empty">هنوز اشتباهی ثبت نشده. آفرین! تمرین کن تا دفتر پر شود.</div>'}`}
/* ---------- PROGRESS ---------- */
function renderProgress(){const q=Object.values(state.quiz),acc=q.length?pct(q.filter(x=>x.ok).length,q.length):0;const fxDone=Object.keys(state.fx).length,fxAll=lessons.reduce((s,l)=>s+l.fx.length,0);return `${heading('کارنامه‌ی مهارتی من','پیشرفت درس‌ها، دقت، آزمایشگاه‌ها و تمرین‌های جای خالی.','گزارش')}<div class="stats3"><div><strong>${fa(state.completed.length)}/${fa(lessons.length)}</strong><small>درس کامل</small></div><div><strong>${fa(acc)}٪</strong><small>دقت خودآزمایی</small></div><div><strong>${fa(fxDone)}/${fa(fxAll)}</strong><small>تمرین جای خالی</small></div><div><strong>${fa(Object.keys(state.labs).length+Object.keys(state.labelsDone).length)}</strong><small>فعالیت تعاملی</small></div></div><h2 class="sub">تسلط بخش‌به‌بخش</h2><div class="skill-list">${units.map(u=>{const ls=lessons.filter(l=>l.unit===u.id);const qs=ls.flatMap(l=>l.quiz.map((_,i)=>state.quiz[`${l.id}-q${i+1}`])).filter(Boolean);const p=qs.length?pct(qs.filter(x=>x.ok).length,qs.length):0;return `<div><span>${u.icon} ${u.title}</span><div class="bar" style="--u:${u.color}"><i style="width:${p}%"></i></div><small>${fa(p)}٪ · ${fa(ls.filter(l=>state.completed.includes(l.id)).length)}/${fa(ls.length)} درس</small></div>`}).join('')}</div><h2 class="sub">جدول ${fa(lessons.length)} درس</h2><table class="table"><thead><tr><th>درس</th><th>خودآزمایی</th><th>جای خالی</th><th>وضعیت</th></tr></thead><tbody>${lessons.map(l=>{const qs=l.quiz.map((_,i)=>state.quiz[`${l.id}-q${i+1}`]).filter(Boolean);const fx=l.fx.filter((_,i)=>state.fx[`${l.id}-${i}`]).length;return `<tr><td><button data-route="lesson/${l.id}">${fa(l.id)}. ${l.title}</button></td><td>${fa(qs.filter(x=>x.ok).length)}/${fa(l.quiz.length)}</td><td>${fa(fx)}/${fa(l.fx.length)}</td><td>${state.completed.includes(l.id)?'✓ کامل':'در حال یادگیری'}</td></tr>`}).join('')}</tbody></table><div class="hero-actions"><button class="button button-primary" data-action="print">چاپ کارنامه</button><button class="button button-ghost" data-action="reset">پاک کردن پیشرفت</button></div>`}

function renderGlossary(){const all=lessons.flatMap(l=>l.glossary.map(g=>({t:g[0],d:g[1],l})));return `${heading('واژه‌نامه‌ی علوم',`${fa(all.length)} واژه‌ی کلیدی با تعریف کوتاه؛ جست‌وجو کن یا کارت‌ها را چاپ کن.`,'کارت‌های مرور')}<div class="glossary-controls"><input type="search" placeholder="جست‌وجوی واژه" data-gl-search><button class="button button-secondary" data-action="print">چاپ کارت‌ها</button><button class="button button-ghost" data-action="flash">حالت کارت مرور</button></div><div class="gl-cards">${all.map(g=>`<article class="gl-card" data-gl="${esc(normalize(g.t+g.d))}" style="--u:${g.l.unitObj.color}"><small>درس ${fa(g.l.id)}</small><h3>${g.t}</h3><p>${g.d}</p></article>`).join('')}</div>`}
let worksheet=null;
function renderWorksheet(){if(!worksheet)return `${heading('مولد برگه‌ی تمرین','برای کلاس یا خانه: بخش و تعداد را انتخاب کن؛ برگه با پاسخنامه چاپ می‌شود.','ابزار آموزگار')}<form id="wsForm" class="setup"><label>بخش<select name="unit"><option value="all">همه</option>${units.map(u=>`<option value="${u.id}">${u.title}</option>`).join('')}</select></label><label>تعداد<select name="n"><option>۱۰</option><option>۱۵</option><option>۲۰</option></select></label><label class="chk"><input type="checkbox" name="key" checked> پاسخنامه</label><button class="button button-primary">ساخت برگه</button></form>`;return `<div class="hero-actions no-print"><button class="button button-primary" data-action="print">چاپ / ذخیره PDF</button><button class="button button-ghost" data-action="ws-reset">تنظیم تازه</button></div><article class="paper"><header><div><span>${TITLE}</span><h1>برگه‌ی تمرین علوم</h1></div><div class="fields"><span>نام: ......................</span><span>کلاس: ........</span><span>تاریخ: ........</span></div></header>${worksheet.items.map((q,i)=>`<div class="pq"><b>${fa(i+1)}. ${q.q}</b><div class="pq-opts">${q.o.map((o,j)=>`<span>${['الف','ب','پ','ت'][j]}) ${o}</span>`).join('')}</div></div>`).join('')}<footer>${CREDIT} · گردآورنده و آموزگار</footer>${worksheet.key?`<section class="key"><h2>پاسخنامه</h2>${worksheet.items.map((q,i)=>`<p><b>${fa(i+1)}.</b> ${q.o[q.a]} — ${q.e}</p>`).join('')}</section>`:''}</article>`}

function r404(){return `${heading('این صفحه پیدا نشد','از منو یکی از بخش‌ها را انتخاب کن.')}<button class="button button-primary" data-route="home">خانه</button>`}
function render(){const r=route(),[root,id]=r.split('/');stopSpeech();if(root!=='games')EXTF.exitGame();document.body.classList.remove('menu-open');let html;
 switch(root){case'home':html=renderHome();break;case'units':html=renderUnits();break;case'unit':html=renderUnit(id);break;case'lesson':html=renderLesson(id);break;case'fill':html=renderFill(id);break;case'labs':html=renderLabs();break;case'lab':html=renderLab(id);break;case'label':html=renderLabel(id);break;case'practice':html=renderPractice();break;case'exams':html=renderExams(id);break;case'mistakes':html=renderMistakes();break;case'progress':html=renderProgress();break;case'glossary':html=renderGlossary();break;case'worksheet':html=renderWorksheet();break;case'projects':html=EXTF.renderProjects();break;case'projectsheet':html=EXTF.renderProjectSheet(id);break;case'report':html=EXTF.renderReport(id);break;case'games':html=EXTF.renderGames();break;case'badges':html=EXTF.renderBadges();break;case'teacher':html=EXTF.renderTeacher();break;case'plan':html=EXTF.renderPlan(id);break;case'parent':html=EXTF.renderParentReport(decodeURIComponent(r.slice(7)));break;default:html=r404()}
 view.innerHTML=credit('top')+html+credit('bottom');const rc=view.querySelector('[data-report-chart]');if(rc){rc.innerHTML=EXTF.chartFromTable(view.querySelector('.report table'))}initLabs(view);initXP(view,lessonMap,id=>{if(id.startsWith('lab:')){state.labs[id.slice(4)]=true;save();cheer();return}if(!state.labs['xp'+id]){state.labs['xp'+id]=true;save();cheer();EXTF.checkBadges()}});localize(view);updateNav();document.getElementById('topbarTitle').textContent=root==='lesson'?(lessonMap.get(id)?.title||TITLE):root==='unit'?(unitMap.get(String(id))?.title||TITLE):TITLE;window.scrollTo({top:0,behavior:'auto'})}
/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r){e.preventDefault();go(r.dataset.route);return}const a=e.target.closest('[data-action]');
 const tag=e.target.closest('.tag');if(tag&&!tag.classList.contains('placed')){document.querySelectorAll('.tag.selected').forEach(t=>t.classList.remove('selected'));tag.classList.add('selected');dragTag=tag;return}

 const nbp=e.target.closest('[data-nb-pred]');if(nbp){const box=nbp.closest('[data-xp]'),id=box.dataset.xp,i=Number(nbp.dataset.nbPred);state.notebook=state.notebook||{};const nb=state.notebook[id]=state.notebook[id]||{};if(nb.pred!=null)return;nb.pred=i;nb.predOk=i===EXT.predict[id].a;save();box.querySelector('.nb').outerHTML=EXTF.xpPre(id);localize(box);EXTF.checkBadges();return}
 const nbs=e.target.closest('[data-nb-save]');if(nbs){const box=nbs.closest('[data-xp]'),id=box.dataset.xp;const nb=state.notebook[id]=state.notebook[id]||{};box.querySelectorAll('[data-nb]').forEach(t=>nb[t.dataset.nb]=t.value.trim());save();ding();toast('در دفتر آزمایش ذخیره شد.');return}
 const dc=e.target.closest('[data-design-check]');if(dc){EXTF.checkDesign(dc.closest('[data-design]'));return}
 const mc=e.target.closest('[data-miscon-ans]');if(mc){const box=mc.closest('[data-miscon]'),id=box.dataset.miscon;state.miscon=state.miscon||{};if(state.miscon[id]!=null)return;state.miscon[id]=Number(mc.dataset.misconAns);save();(state.miscon[id]===(EXT.miscon[id][1]?0:1))?ding():buzz();box.outerHTML=EXTF.miscon(id);localize(view);return}
 const pa=e.target.closest('[data-pretest-ans],[data-pretest-skip]');if(pa){const box=pa.closest('[data-pretest]'),id=box.dataset.pretest;EXTF.pretestAnswer(id,Number(pa.dataset.pretestAns),pa.hasAttribute('data-pretest-skip'));box.outerHTML=EXTF.pretest(lessonMap.get(id));localize(view);return}
 const gm=e.target.closest('[data-game]');if(gm){EXTF.startGame(gm.dataset.game);render();return}
 const ga=e.target.closest('[data-game-ans]');if(ga){EXTF.answerGame(ga.dataset.gameAns);render();return}
 if(e.target.closest('[data-game-exit]')){EXTF.exitGame();render();return}
 const pf=e.target.closest('[data-profile]');if(pf){localStorage.setItem(STORE_BASE+'-profile',pf.dataset.profile);location.reload();return}
 const pr=e.target.closest('[data-parent-report]');if(pr){go('parent/'+encodeURIComponent(pr.dataset.parentReport));return}
 const ad=e.target.closest('[data-assign-del]');if(ad){const sh=EXTF.shared();sh.assign.splice(Number(ad.dataset.assignDel),1);EXTF.saveShared(sh);render();return}
 if(!a)return;const act=a.dataset.action;
 if(act==='speak'){const t=a.closest(a.dataset.target)||view.querySelector(a.dataset.target)||a.parentElement;speakText(t)}
 else if(act==='stop-speech')stopSpeech();
 else if(act==='menu')document.body.classList.toggle('menu-open');
 else if(act==='theme'){state.prefs.theme=state.prefs.theme==='dark'?'light':'dark';save();applyPrefs()}
 else if(act==='access')document.getElementById('accessModal').hidden=false;
 else if(act==='close-access')document.getElementById('accessModal').hidden=true;
 else if(act==='speak-page')speakText(view);
 else if(act==='print')window.print();
 else if(act==='download')void 0;
 else if(act==='export')EXTF.exportAll();
 else if(act==='quiz'){const qid=a.dataset.qid;if(state.quiz[qid])return;const [lid,qn]=qid.split('-q'),q=lessonMap.get(lid).quiz[Number(qn)-1],choice=Number(a.dataset.choice),ok=choice===q.a;state.quiz[qid]={choice,ok,at:Date.now()};save();ok?cheer():buzz();if(!ok)addMistake({...q,id:qid,lesson:lessonMap.get(lid)});const card=a.closest('.quiz-card');card.outerHTML=quizCard(q,qid,Number(qn)-1);localize(view.querySelector(`[data-qid="${qid}"]`))}
 else if(act==='complete'){const id=a.dataset.id;if(!state.completed.includes(id)){state.completed.push(id);save();cheer();toast('آفرین! درس کامل شد.');EXTF.checkBadges()}render()}
 else if(act==='fx-new')fxNew(a.closest('.fx-card'));else if(act==='fx-hint')fxHint(a.closest('.fx-card'));else if(act==='fx-solve')fxSolve(a.closest('.fx-card'));
 else if(act==='lab-reset'){const lab=a.closest('[data-lab]');lab._st._seq=[];updateLab(lab)}
 else if(act==='p-choice'){const i=practiceRun.i;practiceRun.ans[i]={...(practiceRun.ans[i]||{}),choice:Number(a.dataset.choice)};render()}
 else if(act==='p-check')checkPractice();else if(act==='p-hint'){const h=view.querySelector('.hintbox');if(h)h.hidden=false}
 else if(act==='p-next'){practiceRun.i++;if(practiceRun.i>=practiceRun.items.length){practiceRun.done=true;const c=Object.values(practiceRun.ans).filter(x=>x.ok).length;state.practice.push({at:Date.now(),n:practiceRun.items.length,c});save();if(c===practiceRun.items.length)cheer()}render()}
 else if(act==='p-exit'){practiceRun=null;render()}
 else if(act==='e-choice'){examRun.ans[examRun.i]=Number(a.dataset.choice);view.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',o===a))}
 else if(act==='e-next'){if(examRun.ans[examRun.i]==null){toast('یک گزینه انتخاب کن.');return}examRun.i++;if(examRun.i>=examRun.items.length){examRun.done=true;const n=examRun.items.length,c=examRun.items.filter((q,i)=>examRun.ans[i]===q.a).length;examRun.items.forEach((q,i)=>{if(examRun.ans[i]!==q.a)addMistake(q)});state.exams.push({at:Date.now(),title:examRun.title,n,c,p:pct(c,n)});save()}render()}
 else if(act==='e-exit'){examRun=null;render()}
 else if(act==='review-start'){const due=EXTF.dueMistakes();const ms=shuffle(due.length?due:state.mistakes).slice(0,10).map(m=>QALL.find(q=>q.id===m.id)).filter(Boolean);practiceRun={items:ms.map(q=>({...q,tfIdx:q.a,tfAns:0})),i:0,ans:{},mode:'choice',done:false,review:true};go('practice')}
 else if(act==='ws-reset'){worksheet=null;render()}
 else if(act==='flash'){document.querySelectorAll('.gl-card').forEach(c=>c.classList.toggle('flash'))}
 else if(act==='reset'){if(confirm('همه‌ی پیشرفت پاک شود؟')){localStorage.removeItem(STORE);load();render()}}
});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());if(f.id==='practiceForm')startPractice(fd);else if(f.id==='examForm'){const pool=QALL.filter(q=>fd.unit==='all'||String(q.lesson.unit)===fd.unit);examRun={items:shuffle(pool).slice(0,num(fd.n)),i:0,ans:{},done:false,title:fd.unit==='all'?'آزمون جامع':'آزمون بخش '+unitMap.get(fd.unit).title};render()}else if(f.id==='profForm'){const name=(fd.name||'').trim();if(!name)return;localStorage.setItem(STORE_BASE+'-profile',name);location.reload()}else if(f.id==='assignForm'){const sh=EXTF.shared();sh.assign.push({lesson:fd.lesson,type:fd.type,due:Date.now()+num(fd.days)*86400000,at:Date.now()});EXTF.saveShared(sh);toast('تکلیف افزوده شد.');render()}else if(f.id==='wsForm'){const pool=QALL.filter(q=>fd.unit==='all'||String(q.lesson.unit)===fd.unit);worksheet={items:shuffle(pool).slice(0,num(fd.n)),key:!!fd.key};render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-fx-blank]')){fxCheck(t.closest('.fx-card'),t);return}if(t.matches('[data-lab-input]')){const lab=t.closest('[data-lab]');lab._st[t.name]=t.value;const o=lab.querySelector(`[data-out="${t.name}"]`);if(o)o.textContent=fa(t.value);updateLab(lab);return}if(t.matches('[data-gl-search]')){const v=normalize(t.value);document.querySelectorAll('.gl-card').forEach(c=>c.hidden=v&&!c.dataset.gl.includes(v));return}if(t.matches('[data-access]')){const k=t.dataset.access;state.prefs[k]=t.type==='checkbox'?t.checked:Number(t.value);save();applyPrefs()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('select[data-fx-blank]'))fxCheck(t.closest('.fx-card'),t);else if(t.matches('[data-proj]')){state.projects=state.projects||{};const arr=state.projects[t.dataset.proj]=state.projects[t.dataset.proj]||[];arr[Number(t.dataset.i)]=t.checked;save();if(t.checked)ding();render()}else if(t.matches('[data-import]')&&t.files[0]){const r=new FileReader();r.onload=()=>EXTF.importAll(r.result);r.readAsText(t.files[0])}});
document.addEventListener('dragstart',e=>{const t=e.target.closest?.('.tag');if(t){dragTag=t;e.dataTransfer.setData('text/plain',t.dataset.tag)}});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.spot,.group'))e.preventDefault()});
document.addEventListener('drop',e=>{const s=e.target.closest?.('.spot:not(.filled),.group');if(s&&dragTag){e.preventDefault();placeTag(s.closest('.labeler'),dragTag,s);dragTag=null}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('accessModal').hidden=true;document.body.classList.remove('menu-open')}});
function applyPrefs(){const p=state.prefs;document.documentElement.dataset.theme=p.theme;document.documentElement.dataset.contrast=p.contrast?'high':'';document.documentElement.dataset.motion=p.motion?'reduce':'';document.documentElement.style.setProperty('--fs',(1+p.font*0.1)+'rem');window.__lowPower=!!p.lowPower;document.documentElement.dataset.lowpower=p.lowPower?'1':'';document.querySelectorAll('[data-access]').forEach(i=>{if(i.type==='checkbox')i.checked=!!p[i.dataset.access];else i.value=p[i.dataset.access]||0})}
function download(){return;/*html-download-disabled*/const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=COURSE.file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('hashchange',render);applyPrefs();render();
window.__OLUM={state:()=>state,QALL,LAB,NUMGEN};EXTF.checkBadges();
})();
</script>
<script>/*protections*/document.addEventListener('contextmenu',function(e){e.preventDefault()});document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&(k==='s'||k==='u')){e.preventDefault()}});</script></body></html>
